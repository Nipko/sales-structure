name: Deploy Parallext Engine

on:
  push:
    branches:
      - main
    # The mobile app (apps/mobile) ships via EAS, not this pipeline, and docs are
    # not deployable. Skip the web deploy when a push touches ONLY those paths
    # (a push that also changes web/api/infra still deploys normally).
    paths-ignore:
      - 'apps/mobile/**'
      - 'apps/e2e/**'
      - 'docs/**'
  workflow_dispatch:

# All triggers target the same production VPS. Queue deployments instead of
# allowing two runs to migrate/restart the shared stack concurrently.
concurrency:
  group: parallext-production-vps-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/nipko/parallext-api
  WORKER_IMAGE: ghcr.io/nipko/parallext-worker
  DASHBOARD_IMAGE: ghcr.io/nipko/parallext-dashboard
  WHATSAPP_IMAGE: ghcr.io/nipko/parallext-whatsapp
  LANDING_IMAGE: ghcr.io/nipko/parallext-landing
  PROJECT_PATH: /opt/parallext-engine

jobs:
  # ──────────────────────────────────────────────────────────────
  # JOB 0: Validate (the CI gate) — typecheck (5 apps) + lint + migrations apply
  # on a fresh DB + real boot smoke test (DI graph + onModuleInit). Runs on Linux
  # x64 (where bcrypt's prebuilt exists). build-and-push depends on it, so a red
  # validate blocks the whole build + deploy.
  # ──────────────────────────────────────────────────────────────
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Ephemeral infra for the boot smoke test. Postgres gets the schema via
    # `prisma migrate deploy`; Redis backs ioredis/BullMQ which connect eagerly.
    services:
      postgres:
        # pgvector image (Postgres + the `vector` extension) so `prisma migrate
        # deploy` can run any `CREATE EXTENSION vector` migration the KB/RAG uses.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: parallext
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: parallext_engine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parallext -d parallext_engine"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # DB/Redis point at the service containers above. Secrets are CI dummies —
      # the app reads them at construction but makes no real external calls at boot.
      NODE_OPTIONS: --max-old-space-size=8192
      DATABASE_URL: postgresql://parallext:ci@localhost:5432/parallext_engine?schema=public
      DIRECT_DATABASE_URL: postgresql://parallext:ci@localhost:5432/parallext_engine?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      NODE_ENV: test
      JWT_SECRET: ci-dummy-jwt-secret
      JWT_REFRESH_SECRET: ci-dummy-jwt-refresh-secret
      INTERNAL_JWT_SECRET: ci-dummy-internal-jwt-secret
      INTERNAL_API_KEY: ci-dummy-internal-api-key
      ENCRYPTION_KEY: deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef
      OPENAI_API_KEY: sk-ci-dummy-key

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install mobile dependencies
        run: npm ci --prefix apps/mobile

      - name: Marketing claims contract
        run: cd apps/landing && npm run check:claims

      # Deterministic contract gate: 76 canonical + 2 persisted legacy
      # configurations x 4 locales x 5 plans. This validates the
      # manifest/resolver contract only;
      # database bootstrap and end-to-end certification remain separate gates.
      - name: Vertical contract matrix (1,560 scenarios)
        run: node apps/api/scripts/run-vertical-contract-matrix.cjs

      # These are the fail-closed contracts adopted by DEC-01..19. The
      # provider, DB-race, real-model, performance, chaos, rollback and canary
      # gates remain external release evidence; this focused set only prevents
      # deploy from bypassing the code-backed product, authority, money,
      # migration and transport boundaries.
      - name: Vertical operating decision contracts
        run: >-
          npx jest --config apps/api/jest.config.js --runInBand
          apps/api/src/common/utils/primary-pipeline.util.spec.ts
          apps/api/src/common/utils/local-timestamp.util.spec.ts
          apps/api/src/common/utils/native-evidence-opportunity.util.spec.ts
          apps/api/src/common/utils/native-evidence-opportunity-schema.spec.ts
          apps/api/src/common/utils/native-evidence-writers-contract.spec.ts
          apps/api/src/common/utils/trusted-client-ip.util.spec.ts
          apps/api/src/common/utils/tenant-query-void-columns.spec.ts
          apps/api/src/modules/pipeline/pipeline-primary-ownership.spec.ts
          apps/api/src/modules/pipeline/pipeline-write-lead-stage-active-scope.spec.ts
          apps/api/src/modules/crm/crm.controller.spec.ts
          apps/api/src/modules/tours/tours.service.spec.ts
          apps/api/src/modules/vacation-rental/properties.service.spec.ts
          apps/api/src/modules/restaurants/restaurants.service.spec.ts
          apps/api/src/modules/home-services/home-services.service.spec.ts
          apps/api/src/modules/verticals/service-request.listener.spec.ts
          apps/api/src/modules/photography/photography.service.spec.ts
          apps/api/src/modules/education/education.service.spec.ts
          apps/api/src/modules/insurance/insurance.service.spec.ts
          apps/api/src/modules/resource-rentals/resource-rentals.service.spec.ts
          apps/api/src/modules/orders/orders.contacts-pagination.spec.ts
          apps/api/src/modules/pets/pets.pagination.spec.ts
          apps/api/src/modules/verticals/vehicle-inventory.pagination.spec.ts
          apps/api/src/modules/persona/vertical-agent-defaults.util.spec.ts
          apps/api/src/modules/persona/onboarding-persona-resolver.spec.ts
          apps/api/src/modules/persona/vertical-subtype-persona-contract.spec.ts
          apps/api/src/modules/verticals/vertical-capability-manifest.spec.ts
          apps/api/src/modules/verticals/vertical-pipeline-contract.spec.ts
          apps/api/src/modules/verticals/verticals.service.spec.ts
          apps/api/src/modules/verticals/verticals.seed-recovery.spec.ts
          apps/api/src/modules/verticals/vertical-provisioning-reconcile-script.spec.ts
          apps/api/src/modules/conversations/ai-tool-schema-runtime-alignment.spec.ts
          apps/api/src/modules/vertical-contract-matrix/commercial-unit-writers.spec.ts
          apps/api/src/modules/verticals/vertical-product-policy.spec.ts
          apps/api/src/modules/verticals/verticals.controller.spec.ts
          apps/api/src/modules/verticals/vertical-builder-contract.spec.ts
          apps/api/src/modules/verticals/vertical-operating-decisions-schema.spec.ts
          apps/api/src/modules/verticals/vertical-migration.service.spec.ts
          apps/api/src/modules/appointments/calendar-sync-outbox.service.spec.ts
          apps/api/src/modules/appointments/calendar-integration.service.spec.ts
          apps/api/src/modules/appointments/appointments.tenant-isolation.spec.ts
          apps/api/src/modules/appointments/appointments.contact-integrity.spec.ts
          apps/api/src/modules/appointments/appointments.controller.contact-integrity.spec.ts
          apps/api/src/modules/appointments/appointment-capacity.util.spec.ts
          apps/api/src/modules/appointments/public-booking.controller.spec.ts
          apps/api/src/modules/identity/identity.resolve-concurrency.spec.ts
          apps/api/src/modules/public-api/public-api.controller.appointments.spec.ts
          apps/api/src/modules/conversations/tool-policy-registry.spec.ts
          apps/api/src/modules/conversations/tool-execution-control.service.spec.ts
          apps/api/src/modules/conversations/tool-approval-workflow.e2e.spec.ts
          apps/api/src/modules/conversations/payment-operation.service.spec.ts
          apps/api/src/modules/conversations/ai-tool-executor.central-controls.spec.ts
          apps/api/src/modules/conversations/ai-tool-executor.appointment-safety.spec.ts
          apps/api/src/modules/conversations/procedure-engine.central-controls.spec.ts
          apps/api/src/modules/conversations/booking-engine.central-confirmation.spec.ts
          apps/api/src/modules/conversations/ephemeral-agent-sandbox.spec.ts
          apps/api/src/modules/conversations/active-operations-context.service.spec.ts
          apps/api/src/modules/conversations/conversations.widget-containment.spec.ts
          apps/api/src/modules/channels/email/email-webhook-security.service.spec.ts
          apps/api/src/modules/channels/email/email-webhook.controller.spec.ts
          apps/api/src/modules/copilot/assistant-kb-contract.spec.ts
          apps/api/src/modules/copilot/copilot.controller.spec.ts
          apps/api/src/modules/copilot/copilot.service.context.spec.ts
          apps/api/src/modules/quality/agent-quality-signal.service.spec.ts
          apps/api/src/modules/quality/agent-quality.service.spec.ts
          apps/api/src/modules/quality/agent-quality-dependency-events.spec.ts
          apps/api/src/common/guards/internal-auth.guard.spec.ts
          apps/api/src/modules/quality/quality-listener.service.spec.ts
          apps/api/src/modules/quality/quality.agent-attribution.spec.ts
          apps/api/src/modules/quality/quality.controller.spec.ts
          apps/api/src/modules/simulation/completion-events.spec.ts
          apps/api/src/modules/widget/widget.gateway.security.spec.ts
          apps/api/src/modules/widget/widget-capability-policy.spec.ts
          apps/api/src/modules/widget/widget-public.controller.security.spec.ts
          apps/api/src/modules/widget/widget-triggers.controller.security.spec.ts
          apps/api/src/modules/widget/widget-triggers.service.security.spec.ts
          apps/api/src/modules/verticals/operating-currency.service.spec.ts
          apps/api/src/modules/verticals/temporal-capacity-contract.service.spec.ts
          apps/api/src/modules/verticals/staff-operations-model.service.spec.ts
          apps/api/src/common/policies/ai-decision-readiness.policy.spec.ts
          apps/api/src/modules/media-processing/media-ai-governance.policy.spec.ts
          apps/api/src/modules/feature-requests/feature-requests.service.spec.ts
          apps/api/src/modules/push/web-push-isolation.spec.ts
          apps/api/src/modules/push/push.service.spec.ts
          apps/api/src/modules/push/push.service.expo-bounds.spec.ts

      - name: TypeScript check (all apps)
        run: |
          (cd apps/api && npx tsc --noEmit)
          (cd apps/dashboard && npx tsc --noEmit)
          (cd apps/whatsapp && npx tsc --noEmit)
          (cd apps/landing && npx tsc --noEmit)
          (cd apps/mobile && npx tsc --noEmit)

      - name: WhatsApp Agent Quality bridge regression
        run: npm test --prefix apps/whatsapp -- --runInBand src/modules/onboarding/onboarding.service.spec.ts

      - name: Mobile vertical and privacy regression
        run: npm test --prefix apps/mobile -- --runInBand

      - name: Dashboard vertical and wall-clock regression
        run: >-
          npx jest --config apps/dashboard/jest.config.cjs --runInBand
          apps/dashboard/src/lib/vertical-dashboard-resolver.spec.ts
          apps/dashboard/src/lib/local-timestamp.spec.ts
          apps/dashboard/src/lib/help-assistant-contract.spec.ts
          apps/dashboard/src/lib/quality-assistant-contract.spec.ts
          apps/dashboard/src/lib/quality-health.spec.ts
          apps/dashboard/src/lib/initial-setup.spec.ts
          apps/dashboard/src/lib/navigation-contract.spec.ts
          apps/dashboard/src/lib/roles.spec.ts
          apps/dashboard/src/components/appointments/contact-selection.spec.ts

      # Bloqueante desde ago 2026: el codebase quedó lint-clean (commit 64c46827,
      # 28 errores → 0). Es el único gate automático que atrapa la clase de bug
      # "emoji astral en character class sin flag u" (no-misleading-character-class)
      # que corrompía mensajes del cliente — tsc no la ve porque la regex compila.
      - name: Lint (API)
        run: cd apps/api && npx eslint "src/**/*.ts"

      # MercadoPago fue RETIRADO como PSP de plataforma (ago 2026): su adapter,
      # su config service, sus scripts y sus specs salieron del repo. El riel
      # vivo es Wompi, cobrado por el motor de recurrencia propio.
      - name: Billing contract tests
        run: |
          cd apps/api
          npm test -- --runInBand \
            src/modules/billing/billing-plan-display.util.spec.ts \
            src/modules/billing/billing.service.spec.ts

      - name: Prisma generate + migrate (ephemeral DB)
        run: |
          cd apps/api
          npx prisma generate
          npx prisma migrate deploy

      - name: Tenant schema migration compatibility smoke test
        run: cd apps/api && npm run test:migrate:tenants

      - name: Primary pipeline ownership PostgreSQL smoke
        env:
          RUN_PIPELINE_OWNERSHIP_PG_TESTS: '1'
        run: >-
          npx jest --config apps/api/jest.config.js --runInBand
          apps/api/src/common/utils/primary-pipeline.pg.spec.ts

      - name: Build API (+ shared)
        run: npx turbo build --filter=@parallext/api

      - name: Boot smoke test (real NestFactory.create + onModuleInit)
        run: node apps/api/dist/boot-check.js

  # ──────────────────────────────────────────────────────────────
  # JOB 1: Browser smoke — deterministic public/auth journeys. This workflow
  # mocks external APIs and never contacts production services.
  # ──────────────────────────────────────────────────────────────
  e2e-smoke:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/playwright.yml

  # ──────────────────────────────────────────────────────────────
  # JOB 2: Build & push Docker images to GHCR
  # ──────────────────────────────────────────────────────────────
  build-and-push:
    needs: [validate, e2e-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check (API)
        run: cd apps/api && npx tsc --noEmit

      - name: TypeScript check (WhatsApp)
        run: cd apps/whatsapp && npx tsc --noEmit

      # La pantalla de login muestra esto al público. El SHA del commit no le
      # dice nada a un cliente y a un atacante le regala la revisión exacta que
      # está corriendo; la versión del producto informa lo mismo que necesita
      # soporte sin señalar una línea de código.
      - name: Resolve app version
        id: appversion
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=billing-v2
          cache-to: type=gha,mode=max,scope=billing-v2

      - name: Smoke test API — verify module graph resolves
        run: |
          for i in 1 2 3; do
            docker pull ${{ env.API_IMAGE }}:${{ github.sha }} && break
            echo "Pull attempt $i failed, retrying in 15s..."
            sleep 15
          done
          docker run --rm \
            -w /app \
            --entrypoint node \
            ${{ env.API_IMAGE }}:${{ github.sha }} \
            -e "
              try {
                const m = require('./dist/app.module');
                if (!m.AppModule) throw new Error('AppModule not exported');
                console.log('✅ AppModule loaded — all module imports resolved');
                process.exit(0);
              } catch(e) {
                console.error('❌ Module load FAILED:', e.message);
                process.exit(1);
              }
            "
        timeout-minutes: 2

      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.worker
          push: true
          tags: |
            ${{ env.WORKER_IMAGE }}:latest
            ${{ env.WORKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=billing-v2
          cache-to: type=gha,mode=max,scope=billing-v2

      - name: Smoke test Worker — verify workspace runtime resolves
        run: |
          for i in 1 2 3; do
            docker pull ${{ env.WORKER_IMAGE }}:${{ github.sha }} && break
            echo "Pull attempt $i failed, retrying in 15s..."
            sleep 15
          done
          docker run --rm \
            -w /app \
            --entrypoint node \
            ${{ env.WORKER_IMAGE }}:${{ github.sha }} \
            -e "
              try {
                const m = require('./dist/app.module');
                if (!m.AppModule) throw new Error('AppModule not exported');
                console.log('✅ Worker AppModule loaded — all module imports resolved');
                process.exit(0);
              } catch(e) {
                console.error('❌ Worker module load FAILED:', e.message);
                process.exit(1);
              }
            "
        timeout-minutes: 2

      - name: Build and push Dashboard image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.dashboard
          push: true
          tags: |
            ${{ env.DASHBOARD_IMAGE }}:latest
            ${{ env.DASHBOARD_IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.parallly-chat.cloud/api/v1
            NEXT_PUBLIC_WA_SERVICE_URL=https://wa.parallly-chat.cloud/api/v1
            NEXT_PUBLIC_META_APP_ID=${{ secrets.META_APP_ID }}
            NEXT_PUBLIC_META_CONFIG_ID=${{ secrets.META_CONFIG_ID }}
            NEXT_PUBLIC_META_SOLUTION_ID=${{ secrets.META_SOLUTION_ID }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
            NEXT_PUBLIC_MESSENGER_FB_LOGIN_CONFIG_ID=${{ secrets.MESSENGER_FB_LOGIN_CONFIG_ID }}
            NEXT_PUBLIC_INSTAGRAM_APP_ID=1472258884595741
            NEXT_PUBLIC_INSTAGRAM_REDIRECT_URI=https://admin.parallly-chat.cloud/admin/channels/instagram/callback
            NEXT_PUBLIC_APP_VERSION=${{ steps.appversion.outputs.value }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}
          cache-from: type=gha,scope=billing-v2
          cache-to: type=gha,mode=max,scope=billing-v2

      - name: Build and push WhatsApp image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.whatsapp
          push: true
          tags: |
            ${{ env.WHATSAPP_IMAGE }}:latest
            ${{ env.WHATSAPP_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=billing-v2
          cache-to: type=gha,mode=max,scope=billing-v2

      - name: Smoke test WhatsApp image modules
        run: |
          for i in 1 2 3; do
            docker pull ${{ env.WHATSAPP_IMAGE }}:${{ github.sha }} && break
            echo "Pull attempt $i failed, retrying in 15s..."
            sleep 15
          done
          docker run --rm \
            -w /app \
            --entrypoint node \
            ${{ env.WHATSAPP_IMAGE }}:${{ github.sha }} \
            -e "
              try {
                const m = require('./dist/app.module');
                if (!m.AppModule) throw new Error('AppModule not exported');
                console.log('✅ WhatsApp AppModule loaded — all module imports resolved');
                process.exit(0);
              } catch(e) {
                console.error('❌ WhatsApp module load FAILED:', e.message);
                process.exit(1);
              }
            "

      - name: Build and push Landing image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.landing
          push: true
          tags: |
            ${{ env.LANDING_IMAGE }}:latest
            ${{ env.LANDING_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=billing-v2
          cache-to: type=gha,mode=max,scope=billing-v2

  # ──────────────────────────────────────────────────────────────
  # JOB 3: SSH into VPS and deploy
  # Uses: SERVER_HOST, SERVER_USER, SERVER_PASSWORD, SERVER_PORT
  # Project lives at /opt/parallext-engine/
  # ──────────────────────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    # The deploy job logs into GHCR on the VPS (GHCR_PAT = GITHUB_TOKEN) and pulls
    # the images, so its token MUST have packages:read. Without this the docker pull
    # returns "denied" and `set -e` aborts "Deploy to VPS".
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout readiness contract
        uses: actions/checkout@v4

      # We currently have one production environment. The ordinary deploy may reuse
      # its existing infrastructure secrets for the presence-only readiness report,
      # while advanced vertical certification remains a separate, strict manual gate
      # in vertical-quality.yml (workflow_dispatch tier=release).
      - name: Deployment readiness snapshot
        env:
          DATABASE_URL: ${{ secrets.VERTICAL_RELEASE_DATABASE_URL || secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.VERTICAL_RELEASE_REDIS_URL }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          VERTICAL_REAL_MODEL_EVAL_READY: ${{ vars.VERTICAL_REAL_MODEL_EVAL_READY }}
          VERTICAL_CHANNEL_SANDBOX_READY: ${{ vars.VERTICAL_CHANNEL_SANDBOX_READY }}
          VERTICAL_PROVIDER_SANDBOX_READY: ${{ vars.VERTICAL_PROVIDER_SANDBOX_READY }}
          VERTICAL_BULLMQ_READY: ${{ vars.VERTICAL_BULLMQ_READY }}
          VERTICAL_PERF_ENV_READY: ${{ vars.VERTICAL_PERF_ENV_READY }}
          VERTICAL_CHAOS_ENV_READY: ${{ vars.VERTICAL_CHAOS_ENV_READY }}
          VERTICAL_ROLLBACK_EVIDENCE_READY: ${{ vars.VERTICAL_ROLLBACK_EVIDENCE_READY }}
          VERTICAL_CANARY_READY: ${{ vars.VERTICAL_CANARY_READY }}
          VERTICAL_RELEASE_EVIDENCE_JSON: ${{ secrets.VERTICAL_RELEASE_EVIDENCE_JSON }}
          # Missing advanced evidence is reported in the artifact but does not block
          # an ordinary deployment. The explicit release tier still fails closed.
          REQUIRE_EXTERNAL_GATES: 'false'
          VERTICAL_READINESS_OUTPUT: artifacts/vertical-release-readiness.json
        run: |
          missing=()
          [ -n "$DATABASE_URL" ] || missing+=("DATABASE_URL")
          if [ -z "$REDIS_URL" ] && [ -z "$REDIS_HOST" ]; then
            missing+=("REDIS_HOST/REDIS_URL")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required production baseline: ${missing[*]}"
            exit 1
          fi
          node apps/api/scripts/run-vertical-release-readiness.cjs

      - name: Publish deployment readiness
        uses: actions/upload-artifact@v4
        with:
          name: production-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/vertical-release-readiness.json
          if-no-files-found: error
          retention-days: 180

      - name: Check if VPS secrets are configured
        id: check_secrets
        env:
          HOST_CHECK: ${{ secrets.SERVER_HOST }}
        run: |
          if [ -z "$HOST_CHECK" ]; then
            echo "::warning::SERVER_HOST not set — skipping SSH deploy."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      # Gate de pre-conexión: el SSH del VPS a veces es inalcanzable por blips de red
      # o por la ventana del backup nocturno (2AM) que satura el host → "dial tcp i/o
      # timeout". En vez de re-ejecutar el deploy completo (riesgo de aplicarlo a medias),
      # esperamos con backoff a que el puerto SSH acepte conexiones y luego deployamos UNA
      # sola vez. Auto-sana cortes transitorios; si el VPS está caído de verdad, falla con
      # un mensaje accionable en lugar de un timeout críptico.
      - name: Wait for VPS SSH to be reachable
        if: steps.check_secrets.outputs.configured == 'true'
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          PORT="${SSH_PORT:-22}"
          echo "Esperando a que ${SSH_HOST}:${PORT} acepte conexiones SSH..."
          for i in $(seq 1 28); do   # 28 intentos * 15s ≈ 7 min
            if timeout 5 bash -c "true >/dev/tcp/${SSH_HOST}/${PORT}" 2>/dev/null; then
              echo "✓ SSH alcanzable (intento ${i}). Procedo al deploy."
              exit 0
            fi
            echo "  intento ${i}/28: VPS aún sin respuesta en el puerto SSH, reintento en 15s..."
            sleep 15
          done
          echo "::error::El puerto SSH de ${SSH_HOST}:${PORT} no respondió en ~7 min (VPS inalcanzable: backup nocturno / red / firewall / fail2ban). El deploy NO se aplicó — reintentá el job cuando el VPS esté accesible."
          exit 1

      - name: Deploy to VPS
        if: steps.check_secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.2
        env:
          GHCR_PAT: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GIT_SHA: ${{ github.sha }}
          PROD_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROD_DB_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          PROD_REDIS_HOST: ${{ secrets.REDIS_HOST }}
          PROD_REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          PROD_INTERNAL_JWT_SECRET: ${{ secrets.INTERNAL_JWT_SECRET }}
          PROD_JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
          PROD_ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          PROD_META_APP_ID: ${{ secrets.META_APP_ID }}
          PROD_META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          PROD_META_VERIFY_TOKEN: ${{ secrets.META_VERIFY_TOKEN }}
          PROD_META_CONFIG_ID: ${{ secrets.META_CONFIG_ID }}
          PROD_SYSTEM_USER_ID: ${{ secrets.SYSTEM_USER_ID }}
          PROD_INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          PROD_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          PROD_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          PROD_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          PROD_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          PROD_SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          PROD_SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          PROD_SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          PROD_SENTRY_API_URL: ${{ secrets.SENTRY_API_URL }}
          PROD_TELEGRAM_ALERT_BOT_TOKEN: ${{ secrets.TELEGRAM_ALERT_BOT_TOKEN }}
          PROD_TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          PROD_SMS_ALERT_ACCOUNT_SID: ${{ secrets.SMS_ALERT_ACCOUNT_SID }}
          PROD_SMS_ALERT_AUTH_TOKEN: ${{ secrets.SMS_ALERT_AUTH_TOKEN }}
          PROD_SMS_ALERT_FROM: ${{ secrets.SMS_ALERT_FROM }}
          PROD_SMS_ALERT_TO: ${{ secrets.SMS_ALERT_TO }}
          PROD_SMS_SENDER_ID: ${{ secrets.SMS_SENDER_ID }}
          PROD_SMTP_HOST: ${{ secrets.SMTP_HOST }}
          PROD_SMTP_PORT: ${{ secrets.SMTP_PORT }}
          PROD_SMTP_USER: ${{ secrets.SMTP_USER }}
          PROD_SMTP_PASS: ${{ secrets.SMTP_PASS }}
          PROD_SMTP_FROM: ${{ secrets.SMTP_FROM }}
          PROD_EMAIL_INBOUND_WEBHOOK_SECRET: ${{ secrets.EMAIL_INBOUND_WEBHOOK_SECRET }}
          PROD_BULL_BOARD_TOKEN: ${{ secrets.BULL_BOARD_TOKEN }}
          PROD_GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
          PROD_JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          PROD_MS_AUTH_CLIENT_ID: ${{ secrets.MS_AUTH_CLIENT_ID }}
          PROD_MS_AUTH_CLIENT_SECRET: ${{ secrets.MS_AUTH_CLIENT_SECRET }}
          PROD_MS_CLIENT_ID: ${{ secrets.MS_AUTH_CLIENT_ID }}
          PROD_MS_CLIENT_SECRET: ${{ secrets.MS_AUTH_CLIENT_SECRET }}
          # Wompi (Bancolombia). Absent secrets are harmless: the adapter logs a
          # warning and the provider simply stays unroutable — it is off by
          # default in the runtime routing config anyway.
          PROD_WOMPI_PUBLIC_KEY: ${{ secrets.WOMPI_PUBLIC_KEY }}
          PROD_WOMPI_PRIVATE_KEY: ${{ secrets.WOMPI_PRIVATE_KEY }}
          PROD_WOMPI_EVENTS_SECRET: ${{ secrets.WOMPI_EVENTS_SECRET }}
          PROD_WOMPI_INTEGRITY_SECRET: ${{ secrets.WOMPI_INTEGRITY_SECRET }}
          # PIN del dueño para emitir cupones de alto impacto. Opcional: si el
          # secret no está, los cupones de alto impacto se bloquean (fail-closed).
          PROD_OWNER_COUPON_PIN: ${{ secrets.OWNER_COUPON_PIN }}
          # Optional but strongly recommended: numeric User/collector ID shown
          # by the verified MCO merchant. The preflight compares without logging it.
          # Factus (DIAN electronic invoicing — Colombia). Credentials from the
          # Factus admin. FACTUS_BASE_URL = https://api-sandbox.factus.com.co
          # until production go-live.
          PROD_FACTUS_BASE_URL: ${{ secrets.FACTUS_BASE_URL }}
          PROD_FACTUS_CLIENT_ID: ${{ secrets.FACTUS_CLIENT_ID }}
          PROD_FACTUS_CLIENT_SECRET: ${{ secrets.FACTUS_CLIENT_SECRET }}
          PROD_FACTUS_USERNAME: ${{ secrets.FACTUS_USERNAME }}
          PROD_FACTUS_PASSWORD: ${{ secrets.FACTUS_PASSWORD }}
          # Per-country USD→local FX rates. Override via secrets when prices drift.
          # External CRM integrations
          PROD_HUBSPOT_CLIENT_ID: ${{ secrets.HUBSPOT_CLIENT_ID }}
          PROD_HUBSPOT_CLIENT_SECRET: ${{ secrets.HUBSPOT_CLIENT_SECRET }}
          PROD_PIPEDRIVE_CLIENT_ID: ${{ secrets.PIPEDRIVE_CLIENT_ID }}
          PROD_PIPEDRIVE_CLIENT_SECRET: ${{ secrets.PIPEDRIVE_CLIENT_SECRET }}
          # VAPID keys for push notifications
          PROD_VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          PROD_VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          # Offsite backups (S3-compatible: AWS S3 / Cloudflare R2 / Backblaze B2).
          # Read by infra/backup/backup.sh via the generated .env. Leave
          # OFFSITE_BUCKET empty to keep backups local-only.
          PROD_OFFSITE_BUCKET: ${{ secrets.OFFSITE_BUCKET }}
          PROD_OFFSITE_PATH: ${{ secrets.OFFSITE_PATH }}
          PROD_OFFSITE_PROVIDER: ${{ secrets.OFFSITE_PROVIDER }}
          PROD_OFFSITE_REGION: ${{ secrets.OFFSITE_REGION }}
          PROD_OFFSITE_ENDPOINT: ${{ secrets.OFFSITE_ENDPOINT }}
          PROD_OFFSITE_ACCESS_KEY: ${{ secrets.OFFSITE_ACCESS_KEY }}
          PROD_OFFSITE_SECRET_KEY: ${{ secrets.OFFSITE_SECRET_KEY }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          # Key-based SSH auth via a dedicated deploy key. The private key lives
          # ONLY in the SERVER_SSH_KEY secret; the matching public key is in the
          # VPS user's authorized_keys. Password auth was removed after confirming
          # key auth works (deploy 7c39f1a2). Emergency rollback: re-add
          # `password: ${{ secrets.SERVER_PASSWORD }}` below. Next hardening step:
          # set `PasswordAuthentication no` in the VPS sshd_config.
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: |
            GHCR_PAT,GITHUB_ACTOR,GIT_SHA,
            PROD_DATABASE_URL,PROD_DB_PASSWORD,
            PROD_REDIS_HOST,PROD_REDIS_PASSWORD,
            PROD_INTERNAL_JWT_SECRET,PROD_JWT_SECRET,PROD_ENCRYPTION_KEY,
            PROD_META_APP_ID,PROD_META_APP_SECRET,PROD_META_VERIFY_TOKEN,PROD_META_CONFIG_ID,PROD_SYSTEM_USER_ID,
            PROD_INTERNAL_API_KEY,
            PROD_TUNNEL_TOKEN,PROD_GOOGLE_OAUTH_CLIENT_ID,PROD_GOOGLE_OAUTH_CLIENT_SECRET,
            PROD_SENTRY_DSN,PROD_SENTRY_AUTH_TOKEN,PROD_SENTRY_ORG,PROD_SENTRY_PROJECT,PROD_SENTRY_API_URL,PROD_TELEGRAM_ALERT_BOT_TOKEN,PROD_TELEGRAM_ALERT_CHAT_ID,
            PROD_SMS_ALERT_ACCOUNT_SID,PROD_SMS_ALERT_AUTH_TOKEN,PROD_SMS_ALERT_FROM,PROD_SMS_ALERT_TO,PROD_SMS_SENDER_ID,
            PROD_SMTP_HOST,PROD_SMTP_PORT,PROD_SMTP_USER,PROD_SMTP_PASS,PROD_SMTP_FROM,PROD_EMAIL_INBOUND_WEBHOOK_SECRET,
            PROD_BULL_BOARD_TOKEN,PROD_GRAFANA_PASSWORD,PROD_JWT_REFRESH_SECRET,
            PROD_MS_AUTH_CLIENT_ID,PROD_MS_AUTH_CLIENT_SECRET,
            PROD_MS_CLIENT_ID,PROD_MS_CLIENT_SECRET,
            PROD_OWNER_COUPON_PIN,
            PROD_WOMPI_PUBLIC_KEY,PROD_WOMPI_PRIVATE_KEY,PROD_WOMPI_EVENTS_SECRET,PROD_WOMPI_INTEGRITY_SECRET,
            PROD_FACTUS_BASE_URL,PROD_FACTUS_CLIENT_ID,PROD_FACTUS_CLIENT_SECRET,PROD_FACTUS_USERNAME,PROD_FACTUS_PASSWORD,
            PROD_HUBSPOT_CLIENT_ID,PROD_HUBSPOT_CLIENT_SECRET,
            PROD_PIPEDRIVE_CLIENT_ID,PROD_PIPEDRIVE_CLIENT_SECRET,
            PROD_VAPID_PUBLIC_KEY,PROD_VAPID_PRIVATE_KEY,
            PROD_OFFSITE_BUCKET,PROD_OFFSITE_PATH,PROD_OFFSITE_PROVIDER,PROD_OFFSITE_REGION,PROD_OFFSITE_ENDPOINT,PROD_OFFSITE_ACCESS_KEY,PROD_OFFSITE_SECRET_KEY
          # ↑ timeout: tiempo máximo para ESTABLECER la conexión SSH
          # ↑ command_timeout: tiempo máximo de ejecución del script completo
          timeout: 120s
          command_timeout: 20m
          script: |
            set -e
            cd /opt/parallext-engine
            export DC="docker compose --env-file .env -f infra/docker/docker-compose.prod.yml"

            echo "===> Pulling latest infrastructure code..."
            git fetch origin
            # The deploy server tracks origin exactly (config comes from .env, which is
            # gitignored and regenerated below — not from editing tracked files). Stash
            # any local edits to tracked files first (recoverable on the VPS via
            # `git stash list`) so drifted infra scripts can't block the fast-forward,
            # then hard-reset to origin.
            git stash push -m "pre-deploy-$(date +%s)" || true
            git checkout ${{ github.ref_name }}
            git reset --hard "origin/${{ github.ref_name }}"

            echo "===> Removing Watchtower (deploys happen only via this script)..."
            # Watchtower raced this pipeline: it pulled the :latest images pushed
            # minutes ago and restarted containers BEFORE the migrations below ran
            # (new code on old schema) and doubled every restart window. Removing
            # it here (idempotent) also kills the instance already running on the
            # VPS, which the compose file no longer defines.
            docker rm -f parallext-watchtower 2>/dev/null || true

            echo "===> Logging into GHCR..."
            echo "$GHCR_PAT" | docker login ghcr.io \
              -u "$GITHUB_ACTOR" --password-stdin

            echo "===> Pulling images for this commit ($GIT_SHA)..."
            # Pull the IMMUTABLE sha tags, not :latest. compose resolves IMAGE_TAG
            # from .env (written below), so a rollback is IMAGE_TAG=<previous-sha>
            # plus a re-up, with no rebuild.
            docker pull ghcr.io/nipko/parallext-api:$GIT_SHA
            docker pull ghcr.io/nipko/parallext-worker:$GIT_SHA
            docker pull ghcr.io/nipko/parallext-dashboard:$GIT_SHA
            docker pull ghcr.io/nipko/parallext-whatsapp:$GIT_SHA
            docker pull ghcr.io/nipko/parallext-landing:$GIT_SHA

            echo "===> Generating production .env from GitHub Secrets..."
            > .env
            echo "# Parallext Engine - Production Configuration" >> .env
            echo "NODE_ENV=production" >> .env
            echo "LOG_LEVEL=info" >> .env
            echo "DATABASE_URL=postgresql://parallext:${PROD_DB_PASSWORD}@pgbouncer:5432/parallext_engine?pgbouncer=true&connection_limit=8" >> .env
            echo "DIRECT_DATABASE_URL=postgresql://parallext:${PROD_DB_PASSWORD}@postgres:5432/parallext_engine" >> .env
            echo "DB_PASSWORD=${PROD_DB_PASSWORD}" >> .env
            echo "REDIS_HOST=${PROD_REDIS_HOST}" >> .env
            echo "REDIS_PORT=6379" >> .env
            echo "REDIS_PASSWORD=${PROD_REDIS_PASSWORD}" >> .env
            echo "INTERNAL_JWT_SECRET=${PROD_INTERNAL_JWT_SECRET}" >> .env
            echo "JWT_SECRET=${PROD_JWT_SECRET}" >> .env
            echo "JWT_REFRESH_SECRET=${PROD_JWT_REFRESH_SECRET}" >> .env
            echo "ENCRYPTION_KEY=${PROD_ENCRYPTION_KEY}" >> .env
            echo "META_APP_ID=${PROD_META_APP_ID}" >> .env
            echo "META_APP_SECRET=${PROD_META_APP_SECRET}" >> .env
            echo "META_VERIFY_TOKEN=${PROD_META_VERIFY_TOKEN}" >> .env
            echo "META_CONFIG_ID=${PROD_META_CONFIG_ID}" >> .env
            echo "SYSTEM_USER_ID=${PROD_SYSTEM_USER_ID}" >> .env
            echo "INTERNAL_API_KEY=${PROD_INTERNAL_API_KEY}" >> .env
            echo "WHATSAPP_VERIFY_TOKEN=${PROD_META_VERIFY_TOKEN}" >> .env
            echo "# Messenger OAuth" >> .env
            echo "MESSENGER_FB_LOGIN_CONFIG_ID=${{ secrets.MESSENGER_FB_LOGIN_CONFIG_ID }}" >> .env
            echo "MESSENGER_REDIRECT_URI=https://admin.parallly-chat.cloud/admin/channels/messenger" >> .env
            echo "# Instagram OAuth" >> .env
            echo "INSTAGRAM_APP_ID=1472258884595741" >> .env
            echo "INSTAGRAM_APP_SECRET=${{ secrets.INSTAGRAM_APP_SECRET }}" >> .env
            echo "INSTAGRAM_REDIRECT_URI=https://admin.parallly-chat.cloud/admin/channels/instagram/callback" >> .env
            echo "# Frontend Defaults" >> .env
            echo "NEXT_PUBLIC_API_URL=https://api.parallly-chat.cloud/api/v1" >> .env
            echo "NEXT_PUBLIC_WA_SERVICE_URL=https://wa.parallly-chat.cloud/api/v1" >> .env
            echo "NEXT_PUBLIC_META_APP_ID=${PROD_META_APP_ID}" >> .env
            echo "NEXT_PUBLIC_META_CONFIG_ID=${PROD_META_CONFIG_ID}" >> .env
            echo "GOOGLE_OAUTH_CLIENT_ID=${PROD_GOOGLE_OAUTH_CLIENT_ID}" >> .env
            echo "GOOGLE_OAUTH_CLIENT_SECRET=${PROD_GOOGLE_OAUTH_CLIENT_SECRET}" >> .env
            echo "GOOGLE_CALENDAR_REDIRECT_URI=https://api.parallly-chat.cloud/api/v1/calendar/google/callback" >> .env
            echo "SENTRY_DSN=${PROD_SENTRY_DSN}" >> .env
            echo "SENTRY_AUTH_TOKEN=${PROD_SENTRY_AUTH_TOKEN}" >> .env
            echo "SENTRY_ORG=${PROD_SENTRY_ORG}" >> .env
            echo "SENTRY_PROJECT=${PROD_SENTRY_PROJECT}" >> .env
            echo "SENTRY_API_URL=${PROD_SENTRY_API_URL}" >> .env
            echo "# Telegram platform alerts (ops center)" >> .env
            echo "TELEGRAM_ALERT_BOT_TOKEN=${PROD_TELEGRAM_ALERT_BOT_TOKEN}" >> .env
            echo "TELEGRAM_ALERT_CHAT_ID=${PROD_TELEGRAM_ALERT_CHAT_ID}" >> .env
            echo "# SMS platform alerts (ops center)" >> .env
            echo "SMS_ALERT_ACCOUNT_SID=${PROD_SMS_ALERT_ACCOUNT_SID}" >> .env
            echo "SMS_ALERT_AUTH_TOKEN=${PROD_SMS_ALERT_AUTH_TOKEN}" >> .env
            echo "SMS_ALERT_FROM=${PROD_SMS_ALERT_FROM}" >> .env
            echo "SMS_ALERT_TO=${PROD_SMS_ALERT_TO}" >> .env
            echo "SMS_SENDER_ID=${PROD_SMS_SENDER_ID}" >> .env
            echo "# SMTP" >> .env
            echo "SMTP_HOST=${PROD_SMTP_HOST}" >> .env
            echo "SMTP_PORT=${PROD_SMTP_PORT:-587}" >> .env
            echo "SMTP_USER=${PROD_SMTP_USER}" >> .env
            echo "SMTP_PASS=${PROD_SMTP_PASS}" >> .env
            echo "SMTP_FROM=${PROD_SMTP_FROM:-Parallly <${PROD_SMTP_USER}>}" >> .env
            echo "EMAIL_INBOUND_WEBHOOK_SECRET=${PROD_EMAIL_INBOUND_WEBHOOK_SECRET}" >> .env
            echo "EMAIL_INBOUND_WEBHOOK_HEADER=x-email-webhook-secret" >> .env
            echo "EMAIL_INBOUND_MAX_BODY_BYTES=1048576" >> .env
            echo "EMAIL_INBOUND_RATE_LIMIT_PER_MINUTE=600" >> .env
            echo "EMAIL_INBOUND_RECIPIENT_RATE_LIMIT_PER_MINUTE=120" >> .env
            echo "DASHBOARD_URL=https://admin.parallly-chat.cloud" >> .env
            echo "CLOUDFLARE_TUNNEL_TOKEN=${PROD_TUNNEL_TOKEN}" >> .env
            echo "# Observability" >> .env
            echo "BULL_BOARD_TOKEN=${PROD_BULL_BOARD_TOKEN}" >> .env
            echo "GRAFANA_PASSWORD=${PROD_GRAFANA_PASSWORD}" >> .env
            echo "# Microsoft OAuth" >> .env
            echo "MS_AUTH_CLIENT_ID=${PROD_MS_AUTH_CLIENT_ID}" >> .env
            echo "MS_AUTH_CLIENT_SECRET=${PROD_MS_AUTH_CLIENT_SECRET}" >> .env
            echo "MS_AUTH_REDIRECT_URI=https://api.parallly-chat.cloud/api/v1/auth/microsoft/callback" >> .env
            echo "# Microsoft Calendar (same app as auth)" >> .env
            echo "MS_CLIENT_ID=${PROD_MS_CLIENT_ID}" >> .env
            echo "MS_CLIENT_SECRET=${PROD_MS_CLIENT_SECRET}" >> .env
            echo "MS_TENANT_ID=common" >> .env
            echo "MS_CALENDAR_REDIRECT_URI=https://api.parallly-chat.cloud/api/v1/calendar/microsoft/callback" >> .env
            # MercadoPago fue RETIRADO como PSP de plataforma (ago 2026): sus
            # credenciales ya no se escriben al .env. El enlace-de-pago del
            # TENANT usa el token cifrado por-tenant en la base, no estas vars.
            echo "# Wompi (Bancolombia — Colombian rail). Empty until the secrets exist;" >> .env
            echo "# the adapter warns and the provider stays unroutable instead of failing boot." >> .env
            echo "WOMPI_PUBLIC_KEY=${PROD_WOMPI_PUBLIC_KEY}" >> .env
            echo "WOMPI_PRIVATE_KEY=${PROD_WOMPI_PRIVATE_KEY}" >> .env
            echo "WOMPI_EVENTS_SECRET=${PROD_WOMPI_EVENTS_SECRET}" >> .env
            echo "WOMPI_INTEGRITY_SECRET=${PROD_WOMPI_INTEGRITY_SECRET}" >> .env
            echo "WOMPI_WEBHOOK_URL=https://api.parallly-chat.cloud/api/v1/billing/webhook/wompi" >> .env
            # PIN del dueño para cupones de alto impacto / que superan la cuota
            # mensual. Vive en Secrets (no en la DB) para que ningún super_admin
            # pueda resetearlo desde el panel y vaciar el control. Si no se setea,
            # los cupones de rutina funcionan igual; los de alto impacto se bloquean.
            echo "OWNER_COUPON_PIN=${PROD_OWNER_COUPON_PIN}" >> .env
            echo "# Factus (DIAN electronic invoicing — Colombia)" >> .env
            echo "FACTUS_BASE_URL=${PROD_FACTUS_BASE_URL:-https://api-sandbox.factus.com.co}" >> .env
            echo "FACTUS_CLIENT_ID=${PROD_FACTUS_CLIENT_ID}" >> .env
            echo "FACTUS_CLIENT_SECRET=${PROD_FACTUS_CLIENT_SECRET}" >> .env
            echo "FACTUS_USERNAME=${PROD_FACTUS_USERNAME}" >> .env
            echo "FACTUS_PASSWORD=${PROD_FACTUS_PASSWORD}" >> .env
            # Fiscal artifact storage — backed by the parallext-fiscal-data volume
            # mounted on api+worker (legal 5-year retention). Set explicitly for
            # reproducible deploys even though the code defaults to /data/invoices.
            echo "FISCAL_STORAGE_PATH=/data/invoices" >> .env
            echo "# Offsite backups (S3-compatible via rclone — read by infra/backup/backup.sh)" >> .env
            echo "OFFSITE_BUCKET=${PROD_OFFSITE_BUCKET}" >> .env
            echo "OFFSITE_PATH=${PROD_OFFSITE_PATH:-parallext}" >> .env
            echo "OFFSITE_PROVIDER=${PROD_OFFSITE_PROVIDER:-AWS}" >> .env
            echo "OFFSITE_REGION=${PROD_OFFSITE_REGION:-us-east-1}" >> .env
            echo "OFFSITE_ENDPOINT=${PROD_OFFSITE_ENDPOINT}" >> .env
            echo "OFFSITE_ACCESS_KEY=${PROD_OFFSITE_ACCESS_KEY}" >> .env
            echo "OFFSITE_SECRET_KEY=${PROD_OFFSITE_SECRET_KEY}" >> .env
            echo "# External CRM integrations" >> .env
            echo "HUBSPOT_CLIENT_ID=${PROD_HUBSPOT_CLIENT_ID}" >> .env
            echo "HUBSPOT_CLIENT_SECRET=${PROD_HUBSPOT_CLIENT_SECRET}" >> .env
            echo "PIPEDRIVE_CLIENT_ID=${PROD_PIPEDRIVE_CLIENT_ID}" >> .env
            echo "PIPEDRIVE_CLIENT_SECRET=${PROD_PIPEDRIVE_CLIENT_SECRET}" >> .env
            echo "# VAPID Keys for Push Notifications" >> .env
            echo "VAPID_PUBLIC_KEY=${PROD_VAPID_PUBLIC_KEY}" >> .env
            echo "VAPID_PRIVATE_KEY=${PROD_VAPID_PRIVATE_KEY}" >> .env
            echo "API_PUBLIC_URL=https://api.parallly-chat.cloud/api/v1" >> .env
            echo "DASHBOARD_URL=https://admin.parallly-chat.cloud" >> .env
            echo "# App URLs & defaults (code has fallbacks; set explicitly for reproducible deploys)" >> .env
            echo "API_URL=https://api.parallly-chat.cloud" >> .env
            echo "NEXT_PUBLIC_DASHBOARD_URL=https://admin.parallly-chat.cloud" >> .env
            echo "BODY_SIZE_LIMIT=50mb" >> .env
            echo "EMAIL_LOGO_URL=https://parallly-chat.cloud/parallly-logo.svg" >> .env
            echo "EMBEDDING_MODEL=text-embedding-3-small" >> .env
            echo "EMBEDDING_DIMENSIONS=1536" >> .env
            echo "GIT_SHA=${GIT_SHA}" >> .env
            # Image pin read by docker-compose.prod.yml. Rollback: set this to a
            # previous SHA and re-up (see docs/deploy-hardening-runbook.md).
            echo "IMAGE_TAG=${GIT_SHA}" >> .env
            chmod 600 .env
            echo "  [OK] .env generated and secured"

            echo "===> Ensuring postgres, pgbouncer and redis are healthy..."
            $DC \
              up -d postgres pgbouncer redis

            echo "===> Waiting for postgres to be ready..."
            for i in $(seq 1 12); do
              if $DC \
                  exec -T postgres \
                  pg_isready -U postgres > /dev/null 2>&1; then
                echo "  [OK] Postgres ready after ${i}s"
                break
              fi
              echo "  [$i/12] waiting for postgres..."
              sleep 5
            done

            # platform_settings + users auth/profile columns are now created by the
            # Prisma migration 20260623000000_add_user_fields_and_platform_settings
            # (applied by "prisma migrate deploy" below). The previous raw-SQL
            # patches here were removed so the migration chain is the single source
            # of truth for the public schema.

            echo "===> Pre-migration backup (rollback point)..."
            # Dump the WHOLE DB (all schemas) in custom format BEFORE touching the
            # schema, so a bad migration can be rolled back. Runs inside the
            # postgres container (the host has no postgresql-client), same as
            # infra/backup/backup.sh. Best-effort: a failed dump warns but does
            # not block the deploy (the nightly backup is the fallback). Keep only
            # the last 3 pre-deploy dumps so this never fills the disk.
            mkdir -p /backup/pre-deploy
            # FAIL-FAST: migrations are the destructive step, so refusing to run
            # them without a fresh rollback point is the entire purpose of this
            # dump. It used to only warn and continue, leaving the nightly backup
            # (up to 26h old) as the only recovery from a bad migration.
            if docker exec -e PGPASSWORD="${PROD_DB_PASSWORD}" parallext-postgres \
                 pg_dump -U parallext -d parallext_engine --format=custom \
                 > "/backup/pre-deploy/predeploy_$(date +%Y%m%d_%H%M%S).dump"; then
              echo "  [OK] pre-migration dump saved"
            else
              echo "::error::Pre-migration backup FAILED - aborting before migrations (no rollback point). Check /backup disk space and parallext-postgres health."
              exit 1
            fi
            ls -t /backup/pre-deploy/predeploy_*.dump 2>/dev/null | tail -n +4 | xargs -r rm -f

            echo "===> Running Prisma public schema migrations..."
            # No "|| true": a failed public-schema migration MUST abort the deploy.
            # Migrations run before the rolling restart, so aborting here leaves the
            # old (working) containers running — no half-migrated state.
            $DC \
              run --rm \
              api npx prisma migrate deploy --schema=prisma/schema.prisma \
              || { echo "::error::Prisma migrate deploy FAILED — aborting deploy (containers were NOT recreated)"; exit 1; }

            echo "===> Running tenant schema migration (idempotent)..."
            # Runtime y schema se promueven como una sola unidad. Cualquier
            # tenant omitido o statement fallido aborta antes de recrear
            # contenedores; un deploy parcial no puede quedar verde.
            # ssh-action <=1.0.3 rewrote every line when script_stop=true and
            # treated false `if` predicates as fatal commands. Keep normal shell
            # semantics and capture the migration status inside the condition.
            if MIGRATE_OUT="$($DC run --rm api npm run migrate:tenants 2>&1)"; then
              MIGRATE_RC=0
            else
              MIGRATE_RC=$?
            fi
            MIGRATE_OUT="$(printf '%s\n' "$MIGRATE_OUT" | tr -d '\r')"
            SUMMARY="$(printf '%s\n' "$MIGRATE_OUT" | grep -o 'MIGRATE_TENANTS_SUMMARY .*' | tail -1 || true)"
            SKIPPED="$(printf '%s\n' "$SUMMARY" | sed -n 's/.*skipped=\([0-9]*\).*/\1/p')"
            WARNINGS="$(printf '%s\n' "$SUMMARY" | sed -n 's/.*warnings=\([0-9]*\).*/\1/p')"

            echo "$MIGRATE_OUT"

            if [ "$MIGRATE_RC" -ne 0 ]; then
              echo "::error::Tenant migration exited $MIGRATE_RC (fallo fatal). $SUMMARY"
              exit 1
            elif [ -z "$SUMMARY" ]; then
              echo "::error::Tenant migration no emitio resumen verificable."
              exit 1
            else
              SKIPPED="${SKIPPED:-0}"
              WARNINGS="${WARNINGS:-0}"
              if [ "$SKIPPED" -gt 0 ] || [ "$WARNINGS" -gt 0 ]; then
                echo "::error::Tenant migration incompleta — $SUMMARY"
                exit 1
              else
                echo "Tenant migration limpia — $SUMMARY"
              fi
            fi

            echo "===> Bootstrapping missing billing_plans (create-only)..."
            # No "|| true": the seed is create-only; a failure here means a real DB
            # problem, so abort rather than deploy against a bad plan catalog.
            $DC \
              run --rm api node prisma/seed-billing-plans.js \
              || { echo "::error::billing_plans seed FAILED — aborting deploy"; exit 1; }

            # ── Rolling deploy: update services one by one to minimize downtime ──
            # 1. Worker first (no HTTP traffic, no user impact)
            echo "===> [1/4] Updating worker (no downtime)..."
            $DC up -d --no-deps --force-recreate worker

            # 2. API (main service — brief gap while container restarts)
            echo "===> [2/4] Updating API..."
            $DC up -d --no-deps --force-recreate api

            echo "===> Waiting for API health (max 3 min)..."
            STATUS="starting"
            for i in $(seq 1 36); do
              STATUS=$(docker inspect \
                --format='{{.State.Health.Status}}' parallext-api 2>/dev/null \
                || echo "starting")
              echo "  [$i/36] $STATUS"
              if [ "$STATUS" = "healthy" ]; then
                break
              fi
              sleep 5
            done

            if [ "$STATUS" != "healthy" ]; then
              echo "::error::API not healthy after 3 minutes. Last 100 log lines:"
              docker logs parallext-api --tail 100
              exit 1
            fi

            # 3. Frontend + WhatsApp (can update in parallel, API is already healthy)
            echo "===> [3/4] Updating dashboard, whatsapp, landing..."
            $DC up -d --no-deps --force-recreate dashboard whatsapp landing

            # 4. Ensure tunnel is running
            echo "===> [4/4] Ensuring tunnel is running..."
            $DC up -d tunnel

            # Wompi no tiene catálogo remoto de planes: el precio local congelado
            # ES el contrato, así que no hay nada que aprovisionar del lado del
            # proveedor después de un deploy. (Acá vivía el preflight del collector
            # de MercadoPago y cinco `sync-mp-plans.js`, cada uno con `exit 1`, que
            # dejaban en rojo TODO deploy aunque el runtime quedara sano.)
            echo "===> Runtime SHA ${GIT_SHA} activo."

            # ── Post-deploy cleanup: remove old images ──
            echo "===> Pruning old Docker images..."
            docker image prune -f --filter "until=24h" 2>/dev/null || true

            echo "===> Deploy complete! SHA: $GIT_SHA"

      - name: Notify — secrets not configured
        if: steps.check_secrets.outputs.configured == 'false'
        run: |
          echo "## ⚠️ SSH Deploy Skipped" >> $GITHUB_STEP_SUMMARY
          echo "SERVER_HOST secret is not set. Images pushed to GHCR only." >> $GITHUB_STEP_SUMMARY

      - name: Build summary
        if: always()
        run: |
          echo "## 🚀 Images Published to GHCR" >> $GITHUB_STEP_SUMMARY
          echo "| Image | SHA |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| API | \`${{ env.API_IMAGE }}:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Worker | \`${{ env.WORKER_IMAGE }}:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Dashboard | \`${{ env.DASHBOARD_IMAGE }}:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| WhatsApp | \`${{ env.WHATSAPP_IMAGE }}:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Landing | \`${{ env.LANDING_IMAGE }}:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Branch: \`${{ github.ref_name }}\` | Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

          const problems = [], locales = ['es', 'en', 'pt', 'fr'];
          const cases = ['stable', 'switch', 'edited', 'router-error'];
          if (raw.numTotalTests !== 16 || raw.numPassedTests !== 16 || raw.numFailedTests !== 0
            || raw.numRuntimeErrorTestSuites !== 0 || raw.testResults.length !== 1)

name: Vertical Quality Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/dashboard/**'
      - 'apps/mobile/**'
      - 'apps/landing/**'
      - 'apps/whatsapp/**'
      - 'infra/docker/**'
      - 'packages/shared/**'
      - 'docs/vertical-**'
      - '.github/workflows/vertical-quality.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/dashboard/**'
      - 'apps/mobile/**'
      - 'apps/landing/**'
      - 'apps/whatsapp/**'
      - 'infra/docker/**'
      - 'packages/shared/**'
      - '.github/workflows/vertical-quality.yml'
  schedule:
    - cron: '17 5 * * *'
    - cron: '31 6 * * 0'
  workflow_dispatch:
    inputs:
      tier:
        description: Evidence tier to execute
        required: true
        default: contract
        type: choice
        options: [contract, integration, weekly, release]

permissions:
  contents: read

concurrency:
  group: vertical-quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  contract:
    name: PR contract and unit evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://parallext:ci@localhost:5432/parallext_engine?schema=public
          DIRECT_DATABASE_URL: postgresql://parallext:ci@localhost:5432/parallext_engine?schema=public
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma
      - run: npm ci --prefix apps/mobile
      - run: mkdir -p artifacts
      # Root-reviewed proposal only: insert once after mkdir artifacts,
      # before Claims and competitive evidence, without replacing prior steps.
      - name: API production graph and Nest compilation
        run: |
          npm run build --workspace=@parallext/shared
          npx tsc -p apps/api/tsconfig.build.json --listFilesOnly --pretty false > artifacts/api-production-build-files.txt
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const files = fs.readFileSync('artifacts/api-production-build-files.txt', 'utf8').split(/\r?\n/).map(line => line.trim()).filter(file => path.isAbsolute(file) && /\.(?:ts|tsx)$/.test(file));
          const invalid = files.filter(file => /[\\/]apps[\\/]api[\\/]src[\\/].*(?:\.spec|\.e2e-spec)\.tsx?$/.test(file) || /[\\/]apps[\\/]dashboard[\\/]src[\\/]/.test(file));
          const mainPresent = files.some(file => /[\\/]apps[\\/]api[\\/]src[\\/]main\.ts$/.test(file));
          const workerPresent = files.some(file => /[\\/]apps[\\/]api[\\/]src[\\/]worker\.main\.ts$/.test(file));
          const proof = { fileCount: files.length, productionApiTestSourcesAndDashboardConsumers: invalid, mainPresent, workerPresent, noApplicationExecution: true };
          fs.writeFileSync('artifacts/api-production-build-scope.json', JSON.stringify(proof, null, 2) + '\n');
          if (!files.length || invalid.length || !mainPresent || !workerPresent) throw new Error('Production API compilation graph violates runtime/test boundary; inspect saved graph');
          NODE
          npm run build --workspace=@parallext/api
      - name: Claims and competitive evidence
        run: npm run check:claims --prefix apps/landing
      - name: Static 1,660-scenario matrix (canonical + legacy)
        run: node apps/api/scripts/run-vertical-contract-matrix.cjs > artifacts/vertical-contract-matrix.json
      - name: TypeScript contracts
        run: |
          npx tsc -p packages/shared/tsconfig.json --noEmit --pretty false
          npx tsc -p apps/api/tsconfig.json --noEmit --pretty false
          npx tsc -p apps/dashboard/tsconfig.json --noEmit --pretty false
          npx tsc -p apps/mobile/tsconfig.json --noEmit --pretty false
      - name: Application lint contracts
        run: |
          (cd apps/api && npx eslint "src/**/*.ts" --quiet)
          (cd apps/dashboard && npx eslint . --quiet)
          (cd apps/whatsapp && npx eslint "src/**/*.ts" --quiet)
      # ── Generated artefacts must still reflect the code ───────────────────
      #
      # Every one of these is checked in AND produced by a script, and the only
      # thing keeping the two equal is somebody remembering to run the
      # generator. That already failed once: the closure artefacts each
      # described a revision one or two commits behind the one they claimed,
      # and nothing noticed. A rate table that drifts from its sources is the
      # same failure with money attached — it prices a delivery Meta bills at
      # a number nobody authorised.
      #
      # `--check` regenerates in memory and compares; it writes nothing.
      - name: Generated artefacts match their sources
        run: |
          node apps/api/scripts/generate-whatsapp-rates.cjs --check
          node docs/audits/2026-09-09/verify-artifacts.cjs
          node apps/api/scripts/outbound-producer-inventory.cjs --check
      - name: Vertical focal suites

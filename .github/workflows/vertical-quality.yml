            const matches = assertions.filter(assertion => assertion.title === title && assertion.status === 'passed');
            if (matches.length !== 1) problems.push('Expected one passing locale/case: ' + title);
            const observedFile = locale + '-' + testcase + '-observed.json';
            const traceFile = locale + '-' + testcase + '-trace.json';
            expectedFiles.push(observedFile, traceFile);
            try {
              const observed = JSON.parse(fs.readFileSync(path.join(evidence, observedFile), 'utf8'));
              const trace = JSON.parse(fs.readFileSync(path.join(evidence, traceFile), 'utf8'));
              const cleanup = trace.cleanup;
              if (trace.locale !== locale || trace.testcase !== testcase || trace.completed !== true || trace.error !== '')
                throw new Error('Case identity/completion/error mismatch');
              if (cleanup.timerCount !== 0 || cleanup.afterTicks.timerCount !== 0
                || cleanup.afterTicks.pendingMicrotasks.length !== 0 || cleanup.drainError !== '')
                throw new Error('Cleanup timers or microtasks remain');
              if (cleanup.runtime.length !== 0 || cleanup.unexpected.length !== 0)
                throw new Error('Runtime error or unexpected I/O recorded');
              if (cleanup.socketCount !== 2 || cleanup.disconnected.length !== 2
                || cleanup.disconnected.some(count => count !== 1))
                throw new Error('Owned sockets were not disconnected exactly once');
              if (observed.controllerCalls.length !== 1 || observed.routerCalls.length !== 1)
                throw new Error('Real controller/router boundary count differs');
              verifiedTraces.push({ locale, testcase, completed: true, timerCount: 0,
                pendingMicrotasks: 0, runtimeErrors: 0, unexpected: 0, disconnected: cleanup.disconnected });
            } catch (error) { problems.push(title + ': ' + error.message); }
          }
          if (JSON.stringify(fs.readdirSync(evidence).sort()) !== JSON.stringify(expectedFiles.sort()))
            problems.push('Expected exactly32 exclusive observed/trace JSON files');
          const validation = { passed: result.status === 0 && problems.length === 0,
            jest_exit_code: result.status, total: raw.numTotalTests, passed_cases: raw.numPassedTests,
            failed_cases: raw.numFailedTests, runtime_error_suites: raw.numRuntimeErrorTestSuites,
            expected_locales: 4, expected_cases_per_locale: 4, verified_traces: verifiedTraces,
            problems, real_model_calls: false, production_calls: false, no_global_acceptance: true };
          fs.writeFileSync(path.resolve('artifacts/inbox-copilot-rewrite-ui-validation.json'), JSON.stringify(validation, null, 2) + '\n', { flag: 'wx' });
          if (result.status !== 0) process.exit(result.status ?? 1);
          if (!validation.passed) throw new Error('Rewrite16 evidence validation failed: ' + problems.join('; '));

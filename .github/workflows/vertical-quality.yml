  integration:
    name: Merge and nightly infrastructure evidence
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.tier != 'contract')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: parallext
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: parallext_engine
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U parallext -d parallext_engine"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://parallext:ci@localhost:5432/parallext_engine?schema=public
      DIRECT_DATABASE_URL: postgresql://parallext:ci@localhost:5432/parallext_engine?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      NODE_ENV: test
      JWT_SECRET: ci-dummy-jwt-secret
      JWT_REFRESH_SECRET: ci-dummy-jwt-refresh-secret
      INTERNAL_JWT_SECRET: ci-dummy-internal-jwt-secret
      INTERNAL_API_KEY: ci-dummy-internal-api-key
      ENCRYPTION_KEY: deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef
      OPENAI_API_KEY: sk-ci-dummy-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: mkdir -p artifacts
      - name: Public and tenant schema compatibility
        run: |
          cd apps/api
          npx prisma generate
          npx prisma migrate deploy
          npm run test:migrate:tenants
      - name: Lifecycle, pipeline and purge regression
        run: >-
          npx jest --config apps/api/jest.config.js --runInBand
          apps/api/src/modules/auth/auth-readiness.spec.ts
          apps/api/src/modules/auth/auth-onboarding-provisioning.spec.ts
          apps/api/src/modules/pipeline/pipeline-stage-resolver.spec.ts
          apps/api/src/modules/pipeline/pipeline-outcome.util.spec.ts
          apps/api/src/common/utils/primary-pipeline.pg.spec.ts
          apps/api/src/modules/offboarding/offboarding.service.spec.ts
          apps/api/src/modules/verticals/verticals.service.spec.ts
          --json --outputFile artifacts/vertical-integration-jest.json
        env:
          RUN_PIPELINE_OWNERSHIP_PG_TESTS: '1'
      - name: Convert integration evidence to JUnit
        if: always()
        run: node apps/api/scripts/jest-json-to-junit.cjs artifacts/vertical-integration-jest.json artifacts/vertical-integration-jest.xml
      - name: Real Nest boot smoke
        run: |
          npx turbo build --filter=@parallext/api
          node apps/api/dist/boot-check.js
      - name: Environment readiness snapshot
        env:
          VERTICAL_READINESS_OUTPUT: artifacts/vertical-readiness.json
        run: node apps/api/scripts/run-vertical-release-readiness.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vertical-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts
          retention-days: 30
          if-no-files-found: error

  weekly:
    name: Weekly full regression and release preflight
    if: >-
      github.event.schedule == '31 6 * * 0' ||
      (github.event_name == 'workflow_dispatch' && (inputs.tier == 'weekly' || inputs.tier == 'release'))
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.VERTICAL_RELEASE_DATABASE_URL }}
      REDIS_URL: ${{ secrets.VERTICAL_RELEASE_REDIS_URL }}
      OPENAI_API_KEY: ${{ secrets.VERTICAL_EVAL_OPENAI_API_KEY }}
      VERTICAL_REAL_MODEL_EVAL_READY: ${{ vars.VERTICAL_REAL_MODEL_EVAL_READY }}
      VERTICAL_CHANNEL_SANDBOX_READY: ${{ vars.VERTICAL_CHANNEL_SANDBOX_READY }}
      VERTICAL_PROVIDER_SANDBOX_READY: ${{ vars.VERTICAL_PROVIDER_SANDBOX_READY }}
      VERTICAL_BULLMQ_READY: ${{ vars.VERTICAL_BULLMQ_READY }}
      VERTICAL_PERF_ENV_READY: ${{ vars.VERTICAL_PERF_ENV_READY }}
      VERTICAL_CHAOS_ENV_READY: ${{ vars.VERTICAL_CHAOS_ENV_READY }}
      VERTICAL_ROLLBACK_EVIDENCE_READY: ${{ vars.VERTICAL_ROLLBACK_EVIDENCE_READY }}
      VERTICAL_CANARY_READY: ${{ vars.VERTICAL_CANARY_READY }}
      VERTICAL_RELEASE_EVIDENCE_JSON: ${{ secrets.VERTICAL_RELEASE_EVIDENCE_JSON }}
      REQUIRE_EXTERNAL_GATES: ${{ inputs.tier == 'release' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://parallext:ci@localhost:5432/parallext_engine?schema=public
          DIRECT_DATABASE_URL: postgresql://parallext:ci@localhost:5432/parallext_engine?schema=public
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma
      - run: mkdir -p artifacts
      - name: Full API regression
        run: >-
          npx jest --config apps/api/jest.config.js --runInBand
          --json --outputFile artifacts/api-full-jest.json
      - name: Convert weekly evidence to JUnit
        if: always()
        run: node apps/api/scripts/jest-json-to-junit.cjs artifacts/api-full-jest.json artifacts/api-full-jest.xml
      - name: Release environment preflight
        env:
          VERTICAL_READINESS_OUTPUT: artifacts/vertical-release-readiness.json
        run: node apps/api/scripts/run-vertical-release-readiness.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vertical-weekly-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts
          retention-days: 90
          if-no-files-found: error

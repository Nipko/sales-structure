<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 56" role="img" aria-label="Mercado Pago">
  <!-- Yellow circle with cyan handshake (color order matches real MP logo) -->
  <g transform="translate(2, 2)">
    <circle cx="26" cy="26" r="26" fill="#FFE600"/>
    <!-- Stylized handshake: two interlocking curves in MP cyan -->
    <path
      d="M 26 16
         C 19 16, 14 21, 14 26
         C 14 31, 19 36, 26 36
         C 33 36, 38 31, 38 26
         C 38 21, 33 16, 26 16 Z
         M 18 26
         C 18 22, 22 19, 26 19
         L 26 26
         L 18 26 Z
         M 26 26
         L 26 33
         C 30 33, 34 30, 34 26
         L 26 26 Z"
      fill="#00B1EA"
      fill-rule="evenodd"
    />
  </g>

  <!-- Wordmark "Mercado Pago" -->
  <text x="60" y="34" font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="22" fill="#fafafa" letter-spacing="-1">Mercado</text>
  <text x="155" y="34" font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="22" fill="#00B1EA" letter-spacing="-1">Pago</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" role="img" aria-label="Meta Tech Provider">
  <defs>
    <linearGradient id="mtp-blue" x1="0" y1="32" x2="280" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0064E0"/>
      <stop offset="0.5" stop-color="#0099FF"/>
      <stop offset="1" stop-color="#0064E0"/>
    </linearGradient>
  </defs>

  <!-- Meta wordmark (clean, no fake icon) -->
  <text x="0" y="42" font-family="Helvetica, Arial, sans-serif" font-weight="900" font-size="38" fill="url(#mtp-blue)" letter-spacing="-1.5">Meta</text>

  <!-- Vertical separator -->
  <line x1="100" y1="14" x2="100" y2="50" stroke="#3a3a42" stroke-width="1.5"/>

  <!-- Tech Provider tag -->
  <text x="112" y="28" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="13" fill="#fafafa" letter-spacing="0.5">Tech Provider</text>
  <text x="112" y="46" font-family="Helvetica, Arial, sans-serif" font-weight="500" font-size="10" fill="#a1a1aa" letter-spacing="1">PARTNER VERIFICADO</text>
</svg>

# Parallext Engine - Production Docker Compose
#
# Images are pinned by IMAGE_TAG (the deploy writes the commit SHA into .env).
# Rollback = set IMAGE_TAG to a previous SHA and re-up, no rebuild required.
# Falls back to :latest so a manual `docker compose up` still works.
# Deploys happen ONLY via .github/workflows/deploy.yml (migrations first, then
# rolling force-recreate). Watchtower was removed: it raced the deploy script —
# restarting containers onto new :latest images BEFORE migrations ran (new code
# on old schema) and doubling the restart windows per deploy.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  # ---- Cloudflare Tunnel ----
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: parallext-tunnel
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run parallext
    volumes:
      - /opt/cloudflared:/etc/cloudflared:ro
    depends_on:
      - api
      - dashboard
      - whatsapp
      - landing
    logging: *default-logging

  # ---- Landing Page (static site) ----
  landing:
    image: ghcr.io/nipko/parallext-landing:${IMAGE_TAG:-latest}
    container_name: parallext-landing
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  # ---- PgBouncer (Connection Pooler) ----
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: parallext-pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: parallext
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: parallext_engine
      AUTH_TYPE: md5
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: "50"
      MIN_POOL_SIZE: "10"
      RESERVE_POOL_SIZE: "10"
      MAX_CLIENT_CONN: "1000"
      SERVER_IDLE_TIMEOUT: "600"
      QUERY_TIMEOUT: "120"
      QUERY_WAIT_TIMEOUT: "60"
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
    expose:
      - "5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "5432", "-U", "parallext"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  # ---- API Server ----
  api:
    image: ghcr.io/nipko/parallext-api:${IMAGE_TAG:-latest}
    container_name: parallext-api
    restart: unless-stopped
    # Must exceed the 150s drain ceiling in main.ts or Docker SIGKILLs the
    # API's active inbound turn before BullMQ can close it cleanly.
    stop_grace_period: 160s
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://parallext:${DB_PASSWORD:-parallext_secret}@pgbouncer:5432/parallext_engine?pgbouncer=true&connection_limit=8
      DIRECT_DATABASE_URL: postgresql://parallext:${DB_PASSWORD:-parallext_secret}@postgres:5432/parallext_engine
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MEDIA_STORAGE_PATH: /data/media
      GIT_SHA: ${GIT_SHA:-unknown}
      # The worker does the heavy lifting, but keeping ONE consumer alive on the
      # API means BullMQ's stalled-job sweep never stops while the worker
      # restarts. Concurrency is per process, so these add up.
      INBOUND_CONCURRENCY: "1"
    env_file:
      - ../../.env
    volumes:
      - media_data:/data/media
      - api_logs:/data/logs
      # Legal 5-year retention of DIAN invoices (XML+PDF). Shared with the
      # worker, which is the one that issues them — the API only serves them.
      - fiscal_data:/data/invoices
    expose:
      - "3000"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); http.get('http://localhost:3000/api/v1/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    mem_limit: 768m
    logging: *default-logging

  # ---- Dashboard ----
  dashboard:
    image: ghcr.io/nipko/parallext-dashboard:${IMAGE_TAG:-latest}
    container_name: parallext-dashboard
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.parallly-chat.cloud
    expose:
      - "3001"
    depends_on:
      - api
    mem_limit: 512m
    logging: *default-logging

  # ---- Background Worker (BullMQ processors + cron jobs) ----
  worker:
    image: ghcr.io/nipko/parallext-worker:${IMAGE_TAG:-latest}
    container_name: parallext-worker
    restart: unless-stopped
    # worker.main.ts awaits app.close() with no timer of its own, so this is the
    # real budget. 30s was under the ~100s p99 AI turn: every deploy SIGKILLed
    # turns mid-flight, and each kill burns the ONE stalled-job rescue BullMQ
    # grants per job (maxStalledCount: 1).
    stop_grace_period: 150s
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://parallext:${DB_PASSWORD:-parallext_secret}@pgbouncer:5432/parallext_engine?pgbouncer=true&connection_limit=8
      DIRECT_DATABASE_URL: postgresql://parallext:${DB_PASSWORD:-parallext_secret}@postgres:5432/parallext_engine
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Explícito, igual que en la API. El default del código es la misma ruta,
      # pero dejarlo implícito fue justamente lo que hizo invisible que el
      # worker estuviera escribiendo a un /data/media que no era un volumen.
      MEDIA_STORAGE_PATH: /data/media
      INBOUND_CONCURRENCY: "4"
    env_file:
      - ../../.env
    volumes:
      - worker_logs:/data/logs
      # Same fiscal volume as the API — the worker writes DIAN invoices here on
      # payment.succeeded; the API reads them back to serve/re-download.
      - fiscal_data:/data/invoices
      # MISMO volumen de media que la API, y no por simetría: el worker corre
      # `handleDailyArchiving`, que comprime las conversaciones viejas a
      # {convId}.json.gz y DESPUÉS borra los mensajes de Postgres. Sin este
      # montaje escribía el .gz en la capa efímera del contenedor y el borrado
      # se hacía igual: el archivo desaparecía en el siguiente deploy con las
      # filas ya borradas. Pérdida de datos irrecuperable.
      - media_data:/data/media
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 512m
    logging: *default-logging

  # ---- WhatsApp Onboarding Service ----
  whatsapp:
    image: ghcr.io/nipko/parallext-whatsapp:${IMAGE_TAG:-latest}
    container_name: parallext-whatsapp
    restart: unless-stopped
    # Drain window for the graceful shutdown in apps/whatsapp/src/main.ts —
    # in-flight Meta webhooks must reach the BullMQ enqueue before exit.
    stop_grace_period: 30s
    mem_limit: 384m
    environment:
      NODE_ENV: production
      PORT: "3002"
      DATABASE_URL: postgresql://parallext:${DB_PASSWORD:-parallext_secret}@pgbouncer:5432/parallext_engine?pgbouncer=true&connection_limit=4
      DIRECT_DATABASE_URL: postgresql://parallext:${DB_PASSWORD:-parallext_secret}@postgres:5432/parallext_engine
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    env_file:
      - ../../.env
    expose:
      - "3002"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); http.get('http://localhost:3002/api/v1/health/live', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    logging: *default-logging

  # ---- PostgreSQL + pgvector ----
  postgres:
    image: pgvector/pgvector:pg16
    container_name: parallext-postgres
    restart: unless-stopped
    command: >
      postgres
      -c max_connections=200
      -c max_locks_per_transaction=256
      -c shared_buffers=256MB
      -c work_mem=8MB
      -c effective_cache_size=512MB
    environment:
      POSTGRES_USER: parallext
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: parallext_engine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U parallext -d parallext_engine" ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ---- Redis ----
  redis:
    image: redis:7-alpine
    container_name: parallext-redis
    restart: unless-stopped
    command: >-
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
        exec redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD";
      else
        exec redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction;
      fi'
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a $REDIS_PASSWORD} ping | grep -q PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    logging: *default-logging

  # ============================================
  # OBSERVABILITY STACK
  # ============================================

  # ---- Dozzle (real-time Docker log viewer) ----
  dozzle:
    image: amir20/dozzle:latest
    container_name: parallext-dozzle
    restart: unless-stopped
    environment:
      DOZZLE_NO_ANALYTICS: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:9999:8080"
    mem_limit: 64m
    logging: *default-logging

  # ---- Uptime Kuma (endpoint monitoring + alerting) ----
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: parallext-uptime-kuma
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
    ports:
      - "127.0.0.1:3003:3001"
    mem_limit: 192m
    logging: *default-logging

  # ---- Grafana (dashboards + alerting) ----
  grafana:
    image: grafana/grafana:latest
    container_name: parallext-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-parallly-grafana-2026}
      GF_SERVER_ROOT_URL: https://grafana.parallly-chat.cloud
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3004:3000"
    mem_limit: 256m
    logging: *default-logging

  # ---- Loki (log aggregation for Grafana) ----
  loki:
    image: grafana/loki:3.0.0
    container_name: parallext-loki
    restart: unless-stopped
    user: "10001"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
      - ../loki/local-config.yaml:/etc/loki/local-config.yaml:ro
    ports:
      - "127.0.0.1:3100:3100"
    mem_limit: 384m
    logging: *default-logging

  # ---- Promtail (ships Docker logs to Loki) ----
  promtail:
    image: grafana/promtail:3.0.0
    container_name: parallext-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ../promtail/config.yml:/etc/promtail/config.yml:ro
    depends_on:
      - loki
    mem_limit: 128m
    logging: *default-logging

volumes:
  postgres_data:
    name: parallext-postgres-data
  redis_data:
    name: parallext-redis-data
  media_data:
    name: parallext-media-data
  fiscal_data:
    name: parallext-fiscal-data
  api_logs:
    name: parallext-api-logs
  worker_logs:
    name: parallext-worker-logs
  uptime_kuma_data:
    name: parallext-uptime-kuma-data
  grafana_data:
    name: parallext-grafana-data
  loki_data:
    name: parallext-loki-data

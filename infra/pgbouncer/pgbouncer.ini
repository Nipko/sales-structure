[databases]
; All connections route to the parallext_engine database on the postgres host
parallext_engine = host=postgres port=5432 dbname=parallext_engine

[pgbouncer]
; Listen on all interfaces inside the container
listen_addr = 0.0.0.0
listen_port = 6432

; Authentication
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; Pool mode: transaction is REQUIRED for schema-per-tenant (SET LOCAL search_path)
pool_mode = transaction

; Pool sizing — CONNECTION BUDGET:
;   API:      8 connections (Prisma connection_limit)
;   Worker:   8 connections (Prisma connection_limit)
;   WhatsApp: 4 connections (Prisma connection_limit)
;   Total client demand: ~20 connections
;   Pool size: 50 (headroom for spikes + migrations via DIRECT_DATABASE_URL)
;
; PostgreSQL max_connections = 200 (set in docker-compose command)
; PgBouncer funnels 500 client connections through 50 real PG connections
default_pool_size = 50
min_pool_size = 10
reserve_pool_size = 10
reserve_pool_timeout = 3

; Client limits
; max_client_conn: how many total client connections PgBouncer accepts
max_client_conn = 1000

; Timeouts
server_idle_timeout = 600
client_idle_timeout = 0
client_login_timeout = 60
; query_timeout: max time a query can run before being killed
; 120s to accommodate heavy CRM analytics, nurturing stale-check, and migrations
query_timeout = 120
; query_wait_timeout: max time a client waits for a connection from the pool
query_wait_timeout = 60

; Logging
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60

; Admin access (for monitoring via pgbouncer SHOW commands)
admin_users = parallext
stats_users = parallext

; Ignore SET statements that Prisma sends (important for compatibility)
ignore_startup_parameters = extra_float_digits,options

# B2 · Requisitos del NÚCLEO (aplican a todo negocio)
# Formato: ver schema.md. Intenciones: B1 §B (C01–C33, T01–T11) y §C (Pnn-k).
# storage_today se leyó del worktree lang-ubicado-4300 (6f79b0db); en v0.2 los «verificar» se resolvieron contra la BD y el commit 97bc0dcb: ver schema.md §12 y validacion-dental-comida.md §4.
spec_version: 1.1.0-rc.1  # B2 v0.2 aprobada (D1–D15) + predicate_kind y criticality.when (R1) + evidencia de texto en WARRANTY y REFUND_RETURNS (R1.1, menor)
layer: core
requirements:

# ─────────────────────────── IDENTIDAD ───────────────────────────
- id: CORE.IDENTITY.NAME
  title: Nombre comercial del negocio
  kind: knowledge
  applies_when: always
  answers: [C01, T11]
  exposure: always_in_context
  data:
    name: biz.profile.name
    type: text_i18n
    structure: {display_name: requerido, legal_name: opcional}
    validation: ["1–120 caracteres", "no igual al slug técnico ni a 'Mi negocio'"]
    example: {display_name: "Clínica Dental Sonrisa"}
  criticality: {level: bloqueante, rule: R1}
  when_missing: {code: GAP, behavior: "No aplica en operación: sin nombre el agente no se publica."}
  sources: {allowed: [owner_form, copilot_approved]}
  collection: {channels: [form], ui_today: /onboarding, storage_today: "Tenant.name (= companies.name de la fila is_primary)", storage_status: existe}
  readiness:
    predicate_kind: custom
    predicate: "existe(display_name) y estado = confirmado y display_name ≠ slug técnico y ≠ 'Mi negocio' (valores por defecto del alta)"
    gap_message: "Falta el nombre con el que el agente presenta tu negocio."
  qa_truth: "Pregunta por el nombre o saludo: el agente usa display_name exacto."

- id: CORE.IDENTITY.DESCRIPTION
  title: Qué es y qué hace el negocio
  kind: knowledge
  applies_when: always
  answers: [C01, C06, T09]
  exposure: always_in_context
  data:
    name: biz.profile.description
    type: text_i18n
    structure: {short: "1–2 frases (≤300 car.)", audience: "enum_list [B2C, B2B]", category_label: "texto visible (p. ej. 'consultorio odontológico')"}
    validation: ["short ≥ 40 caracteres", "sin patrones de plantilla ('somos un negocio dedicado a…' sin rubro)", "no contiene precios ni horarios (van en sus campos)"]
    example: {short: "Consultorio odontológico en Chapinero: limpiezas, ortodoncia e implantes para adultos y niños.", audience: [B2C]}
  criticality: {level: bloqueante, rule: R1}
  when_missing: {code: NC+AV, behavior: "Nunca debería ocurrir en producción (bloqueante). En modo ensayo: describe solo la categoría del perfil.", never: ["inventar especialidades o servicios"]}
  sources: {allowed: [owner_form, copilot_approved], accepts_text_evidence: false}
  collection: {channels: [form, copilot_extraction], ui_today: /admin/settings/business-info, storage_today: "companies.about (fila is_primary del esquema del tenant; texto libre) + audience en settings.customerTypes", storage_status: parcial}
  readiness:
    predicate_kind: custom
    predicate: "existe(short) y válido(short) y estado = confirmado y audience no vacío"
    gap_message: "Describe en una o dos frases qué hace tu negocio y para quién."
  qa_truth: "C01: la respuesta contiene la categoría y lo esencial de 'short'; no añade servicios que no estén en CORE.OFFER.ITEMS."

- id: CORE.IDENTITY.PROFILE
  title: Perfil efectivo, objetos habilitados y dominios
  kind: config
  applies_when: always
  answers: []
  exposure: platform_only
  data:
    name: biz.profile.effective_profile
    type: enum
    structure: {profile: "P00…P28 (B1 §A)", subtype: "subtipo canónico", objects_enabled: "enum_list de objects.yaml (por defecto: objects_default del perfil)", domains: "derivado del perfil, no editable", operating_facts: "hechos de schema §4.1 (modality, delivery_offered, has_prepayment, hours_always_open, conditional_domain_facts); cada uno declarado o tomado de operating_facts_defaults del perfil"}
    validation: ["profile coherente con subtype", "objects_enabled ⊆ objetos permitidos del perfil", "al menos un objeto (P00 usa lead)", "todo dominio condicional del perfil ('si …') tiene su hecho declarado"]
    example: {profile: P08, subtype: salud/dental, objects_enabled: [appointment], domains: [health]}
  criticality: {level: bloqueante, rule: R1}
  when_missing: {code: GAP, behavior: "Sin perfil no se pueden calcular los demás requisitos; el agente no se publica."}
  sources: {allowed: [owner_form]}
  collection: {channels: [form], ui_today: /onboarding, storage_today: "Tenant.industry + settings.subType (80 subtipos → 29 perfiles: el mapeo es nuevo); objetos hoy implícitos en settings.verticalConfig.effectiveCapabilities y bookingEnabled; operating_facts: nuevo", storage_status: parcial}
  readiness:
    predicate_kind: custom
    predicate: "existe(subtype) confirmado y el mapeo subtipo→perfil resuelve y cuenta(objects_enabled, explícitos o default del perfil) ≥ 1 y todo hecho de dominio condicional del perfil declarado"
    gap_message: {ausente: "Elige el tipo de negocio y qué quieres que el agente gestione (citas, pedidos, reservas…).", hecho_sin_declarar: "Cuéntanos {hecho} (p. ej. si atiendes a menores) para saber qué debe cumplir tu agente."}
  qa_truth: "Define qué bancos QA aplican al tenant (núcleo + perfil + objetos)."

- id: CORE.IDENTITY.REGION
  title: País de operación, zona horaria, moneda e idioma base
  kind: config
  applies_when: always
  answers: [C02, C03, C04, C12, T04]
  exposure: always_in_context
  data:
    name: biz.profile.region
    type: enum
    structure: {operating_country: ISO-3166, timezone: IANA, currency: ISO-4217, default_locale: BCP-47, country_pack: "id+versión"}
    validation: ["timezone pertenece al país (o declarada como excepción)", "currency válida", "country_pack existe para el país"]
    example: {operating_country: CO, timezone: America/Bogota, currency: COP, default_locale: es-CO, country_pack: "CO@3"}
  criticality: {level: bloqueante, rule: R1}
  when_missing: {code: GAP, behavior: "Bloqueante. Nunca se infiere el país, la ciudad ni la moneda (B1 C02).", never: ["inferir país o moneda por el idioma del cliente"]}
  sources: {allowed: [owner_form, country_pack]}
  collection: {channels: [form], ui_today: /admin/settings/localization, storage_today: "Tenant.operatingCountry, operatingTimezone, operatingCurrency, defaultLocale, countryPackId (+ regionalProvenance)", storage_status: existe}
  readiness:
    predicate_kind: custom
    predicate: "operating_country, timezone y currency existen con origen declarado (no 'fallback') y country_pack resuelto"
    gap_message: "Confirma país, zona horaria y moneda en que opera tu negocio."
  qa_truth: "Fija la moneda esperada de todos los precios y la hora local para 'abierto ahora' (C04)."
  notes: "v0.2: settings.timezone y Tenant.language NO son origen declarado; regional_provenance vacío o 'fallback' ⇒ ausente. Sin país tampoco se resuelven CORE.SAFETY.EMERGENCY_BASE ni DOM.*.EMERGENCY_PROTOCOL: esos fallos se atribuyen aquí (schema §9)."

# ─────────────────────────── UBICACIÓN Y COBERTURA ───────────────────────────
- id: CORE.LOCATIONS.LIST
  title: Sedes y modalidad de atención
  kind: knowledge
  applies_when: always
  answers: [C02, C05, P05-8, P07-5, P08-9, P09-5]
  exposure: always_in_context
  data:
    name: biz.locations[]
    type: list
    structure:
      modality: "ref CORE.IDENTITY.PROFILE.operating_facts.modality (fuente única; enum_list [presencial, online, a_domicilio])"
      locations: "lista de {name, address: address, map_url?, is_main, modality_override?}; requerida si modality incluye presencial"
      address_privacy: "enum [publica, solo_barrio, tras_confirmar] (por defecto publica)"
    validation: ["si presencial: ≥1 sede con city y country", "country de cada sede = operating_country salvo excepción declarada", "exactamente una is_main si hay >1 sede"]
    example: {modality: [presencial], locations: [{name: "Sede Chapinero", address: {line1: "Cra 13 #63-21", city: Bogotá, country: CO}, map_url: "https://maps.app.goo.gl/…", is_main: true}]}
  criticality: {level: bloqueante, rule: R1}
  when_missing: {code: NC+AV, behavior: "Si hay varias sedes y el cliente no dijo zona: PREG (una pregunta). Si falta la dirección: «no tengo la dirección confirmada» + AV.", never: ["inferir ciudad o país", "inventar dirección o referencias"]}
  sources: {allowed: [owner_form, copilot_approved, integration]}
  collection: {channels: [form, copilot_extraction], ui_today: /admin/settings/business-info, storage_today: "companies.address/city/country (fila is_primary; una sola, texto) + Tenant.operatingCountry", storage_status: parcial, notes: "multi-sede y modalidad: nuevo"}
  readiness:
    predicate_kind: custom
    predicate: "existe(modality) y (no incluye presencial o cuenta(locations con city y country válidos y confirmados) ≥ 1)"
    gap_message: "Indica dónde atiendes (dirección, ciudad, país) o si atiendes solo online o a domicilio."
  qa_truth: "C02: AFIRMA dirección y ciudad de la sede pedida o de la principal; con varias sedes y sin zona, la esperada es PREG; si address_privacy≠publica, dice que se comparte al confirmar."

- id: CORE.LOCATIONS.ACCESS
  title: Cómo llegar, parqueadero, accesibilidad y amenidades del lugar
  kind: knowledge
  applies_when: "modality_includes(presencial)"
  answers: [C02, P01-5, P05-4, P13-7]
  exposure: read_on_intent
  data:
    name: biz.locations[].access
    type: list
    structure: {directions: text_i18n, parking: "enum [propio, convenio, calle, no_hay] + nota", accessibility: "enum_list [rampa, ascensor, baño_adaptado, …] o vacío confirmado", amenities: "enum_list abierto (wifi, terraza, mascotas, duchas, lockers…)"}
    validation: ["cada campo admite vacío confirmado", "parking = no_hay solo si lo confirmó el dueño"]
    example: {parking: {value: convenio, note: "Parqueadero Calle 64, 1 h gratis"}, accessibility: [rampa, ascensor]}
  criticality: {level: recomendado, rule: R5}
  when_missing: {code: NC+AV, behavior: "«No tengo confirmado si hay parqueadero» + AV.", never: ["«no hay parqueadero» sin vacío confirmado"]}
  sources: {allowed: [owner_form, copilot_approved], accepts_text_evidence: true}
  collection: {channels: [form, copilot_extraction], ui_today: nuevo, storage_today: nuevo, storage_status: nuevo}
  readiness:
    predicate_kind: confirmed_fields
    predicate_params: {fields: [parking, accessibility]}
    predicate: "por sede: parking y accessibility existen (valor o vacío confirmado)"
    gap_message: "Cuenta si hay parqueadero y accesibilidad: los clientes lo preguntan."
  qa_truth: "Confirmado → AFIRMA; vacío confirmado → NIEGA; ausente → NC+AV (nunca 'no hay')."

- id: CORE.SERVICE_AREA
  title: Zona de cobertura (domicilio, servicio en sitio)
  kind: knowledge
  applies_when: "modality_includes(a_domicilio) or delivery_offered"
  answers: [C18, P02-6, P16-1, P17-8, P18-3, P20-5]
  exposure: read_on_intent
  data:
    name: delivery.zones
    type: list
    structure: {zones: "lista de {name, kind: barrio|ciudad|radio_km|código_postal|polígono, value, surcharge?: money, eta?: duration}", outside_zone_policy: "enum [no_atiende, con_recargo, a_consultar]"}
    validation: ["≥1 zona", "radio_km > 0", "zonas nombradas sin duplicados"]
    example: {zones: [{name: Chapinero, kind: barrio, value: Chapinero, surcharge: {amount: 0, currency: COP}, eta: {min: 30, max: 45, unit: min}}], outside_zone_policy: a_consultar}
  criticality: {level: necesario, rule: R4, conditional: "bloqueante (R2) si el objeto que entrega (food_order, catalog_order, service_request) tiene write_mode = direct_commit", when: [{if: "direct_commit_any([food_order, catalog_order, service_request])", level: bloqueante, rule: R2}]}
  when_missing: {code: PREG, behavior: "Si falta la zona del cliente: PREG (barrio o dirección). Si la zona del cliente no está cargada: NC+AV según outside_zone_policy; si ausente: «no tengo confirmada la cobertura en {zona}» + AV.", never: ["afirmar cobertura no listada", "pedir la dirección completa solo para cotizar (P02-1)"]}
  sources: {allowed: [owner_form, import, integration]}
  collection: {channels: [form, import], ui_today: nuevo, storage_today: "nuevo (verificado: /admin/menu no tiene zonas; food_orders.delivery_fee es por pedido)", storage_status: nuevo}
  readiness:
    predicate_kind: confirmed_fields
    predicate_params: {fields: ["zones[]", outside_zone_policy]}
    predicate: "cuenta(zones válidas y confirmadas) ≥ 1 y existe(outside_zone_policy)"
    gap_message: "Define a qué zonas llegas y con qué recargo."
  qa_truth: "Zona listada → AFIRMA cobertura, recargo y tiempo; zona no listada → según outside_zone_policy; sin dato → NC+AV."

- id: CORE.DELIVERY.TERMS
  title: Condiciones de entrega, envío o recogida
  kind: policy
  applies_when: "delivery_offered"
  answers: [C10, C18, P02-1, P02-6, P03-7, P04-5]
  exposure: read_on_intent
  data:
    name: delivery.terms
    type: policy_terms
    structure: {methods: "enum_list [domicilio_propio, transportadora, recogida_en_local, envío_nacional, envío_internacional]", cost: "money fijo | por zona (ref CORE.SERVICE_AREA) | tabla por peso", min_order: "money?", eta: duration, free_from: "money?", carriers: "lista?", tracking: bool}
    validation: ["si methods incluye domicilio_propio ⇒ ref_cumple(CORE.SERVICE_AREA)", "eta.min > 0"]
    example: {methods: [domicilio_propio, recogida_en_local], cost: "por zona", min_order: {amount: 20000, currency: COP}, eta: {min: 30, max: 60, unit: min}}
  criticality: {level: necesario, rule: R4, conditional: "bloqueante (R2) si food_order o catalog_order tienen write_mode = direct_commit", when: [{if: "direct_commit_any([food_order, catalog_order])", level: bloqueante, rule: R2}]}
  when_missing: {code: NC+AV, behavior: "Para cotizar: da el subtotal y dice qué cargo falta (C10). Para la condición: «no tengo confirmado el costo de envío» + AV.", never: ["«envío gratis» sin free_from o costo 0 confirmado", "usar como costo el delivery_fee = 0 que el motor pone por defecto"]}
  sources: {allowed: [owner_form, integration]}
  collection: {channels: [form], ui_today: "/admin/settings/policies (tipo shipping, texto)", storage_today: "policies.type = shipping (texto libre)", storage_status: parcial}
  readiness:
    predicate_kind: confirmed_fields
    predicate_params: {fields: ["methods[]", cost, eta]}
    predicate: "existe(methods) y existe(cost) y existe(eta) y estado = confirmado"
    gap_message: "Indica cómo entregas, cuánto cuesta y cuánto tarda."
  qa_truth: "C10 con envío: total = subtotal (oráculo) + costo de la zona; si el costo no consta, la esperada es subtotal + «falta el envío»."

# ─────────────────────────── HORARIO ÚNICO ───────────────────────────
- id: CORE.HOURS.REGULAR
  title: Horario habitual por día (fuente única)
  kind: knowledge
  applies_when: always
  answers: [C03, C04, C15, P11-2, P04-5]
  exposure: always_in_context
  data:
    name: biz.hours
    type: weekly_hours
    structure: {scope: "negocio | por sede", always_open: "bool (24/7)", by_appointment_only: bool, days: "7 días × tramos"}
    validation: ["los 7 días declarados (cerrado es un valor)", "tramos sin solapes", "timezone = CORE.IDENTITY.REGION.timezone salvo sede en otra zona"]
    example: {days: {mon: [["08:00","12:00"],["14:00","18:00"]], sat: [["09:00","13:00"]], sun: []}}
  criticality: {level: bloqueante, rule: R1}
  when_missing: {code: NC+AV, behavior: "Solo en ensayo. Responde el día preguntado, no todo el horario.", never: ["asumir horario estándar"]}
  sources: {allowed: [owner_form, copilot_approved, integration]}
  collection: {channels: [form, copilot_extraction], ui_today: /admin/settings/business-hours, storage_today: "settings.businessHours (canónico propuesto); duplicados a unificar: persona config.hours y availability_slots/staff_schedules (agenda); agent_personas.schedule_mode es el horario DEL AGENTE, no del negocio", storage_status: parcial}
  readiness:
    predicate_kind: custom
    predicate: "7 días declarados, válido(weekly_hours), estado = confirmado y sin_contradicción con config.hours ni con la agenda (§7.3)"
    gap_message: {ausente: "Confirma tu horario de cada día.", sembrado: "El horario cargado es de ejemplo del alta: confírmalo o cámbialo.", contradictorio: "Confirma tu horario de cada día; hoy hay más de un horario cargado y no coinciden."}
  qa_truth: "C03: AFIRMA los tramos del día pedido en la zona del negocio. 'Abierto ahora' se calcula con la hora local del caso (oráculo)."
  notes: "La agenda de profesionales (OBJ.APPOINTMENT.AVAILABILITY_SOURCE) debe estar contenida en este horario o declarar su excepción."

- id: CORE.HOURS.HOLIDAYS
  title: Qué hace el negocio en festivos del país
  kind: knowledge
  applies_when: "not hours_always_open"
  answers: [C04, P04-5]
  exposure: always_in_context
  data:
    name: biz.hours_exceptions[holidays]
    type: list
    structure: {default_rule: "enum [cerrado, horario_habitual, horario_domingo, decidir_cada_uno]", per_holiday: "lista de date_exception para el año en curso (del pack de país)"}
    validation: ["si default_rule = decidir_cada_uno: todos los festivos de los próximos 60 días tienen date_exception"]
    example: {default_rule: cerrado, per_holiday: [{date: "2026-12-08", kind: horario_especial, hours: [["09:00","13:00"]], reason: "Inmaculada Concepción"}]}
  criticality: {level: necesario, rule: R4}
  when_missing: {code: NC+AV, behavior: "«Normalmente abrimos {horario del día}; para el festivo {fecha} no tengo el horario confirmado» + AV.", never: ["asumir en silencio el horario habitual en un festivo"]}
  sources: {allowed: [owner_form, country_pack], max_age: "por año calendario"}
  collection: {channels: [form, platform], ui_today: nuevo, storage_today: "blocked_dates (por profesional, solo agenda) — no sirve para el negocio; calendario de festivos en el pack de país: no existe (verificado)", storage_status: nuevo}
  readiness:
    predicate_kind: custom
    predicate: "existe(default_rule) confirmado para el año en curso y no_caducado"
    gap_message: "Dinos qué haces en festivos (cerrar, horario normal o especial)."
  qa_truth: "C04 en festivo: per_holiday > default_rule; sin ninguno → NC+AV con el horario habitual como 'normalmente'."
  owner_decision: E5

- id: CORE.HOURS.EXCEPTIONS
  title: Cierres y horarios especiales puntuales (vacaciones, temporada)
  kind: knowledge
  applies_when: always
  answers: [C04, C15]
  exposure: always_in_context
  data:
    name: biz.hours_exceptions[ad_hoc]
    type: list
    structure: "lista de date_exception (puede ser vacío confirmado)"
    validation: ["fechas futuras o en curso", "sin solape entre excepciones"]
    example: [{date_range: ["2026-12-24","2027-01-06"], kind: horario_especial, hours: [["10:00","14:00"]], reason: "temporada"}]
  criticality: {level: recomendado, rule: R5}
  when_missing: {code: NC+AV, behavior: "Se usa el horario habitual (no hay excepción que declarar)."}
  sources: {allowed: [owner_form], max_age: "90 días sin revisar → aviso"}
  collection: {channels: [form], ui_today: nuevo, storage_today: nuevo, storage_status: nuevo}
  readiness:
    predicate_kind: value_or_empty
    predicate_params: {max_age_days: 90}
    predicate: "lista revisada (valor o vacío confirmado) en los últimos 90 días"
    gap_message: "¿Tienes cierres o horarios especiales próximos?"
  qa_truth: "Fecha dentro de una excepción → AFIRMA la excepción; si no, el horario habitual."

- id: CORE.HOURS.BY_SERVICE
  title: Horarios distintos por servicio o área (cocina, check-in, urgencias, atención humana)
  kind: knowledge
  applies_when: always
  answers: [C03, P05-2, P08-7, P13-3]
  exposure: read_on_intent
  data:
    name: biz.hours.by_service
    type: list
    structure: "lista de {scope: ref ítem/categoría/área, hours: weekly_hours}"
    validation: ["contenido en CORE.HOURS.REGULAR o marcado como fuera de horario (p. ej. urgencias 24 h)"]
    example: [{scope: "cocina", hours: {mon: [["12:00","22:00"]]}}]
  criticality: {level: recomendado, rule: R5}
  when_missing: {code: NC+AV, behavior: "Usa el horario general y lo dice («nuestro horario general es…»)."}
  sources: {allowed: [owner_form]}
  collection: {channels: [form], ui_today: nuevo, storage_today: "nuevo (hoy por vertical, p. ej. check-in en properties)", storage_status: nuevo}
  readiness:
    predicate_kind: value_or_empty
    predicate: "vacío confirmado, o cuenta(entradas) ≥ 1 y todas válidas"
    gap_message: "¿Algún servicio tiene un horario distinto al general?"
  qa_truth: "Pregunta por un área con horario propio → AFIRMA ese horario; si no existe, el general con la aclaración."

# ─────────────────────────── CONTACTO E IDIOMAS ───────────────────────────
- id: CORE.CONTACT.CHANNELS
  title: Teléfono, WhatsApp, correo, web y redes
  kind: knowledge
  applies_when: always
  answers: [C05, C30]
  exposure: always_in_context
  data:
    name: biz.contact
    type: list
    structure: "lista de contact_point (phone, whatsapp, email, web, social) con label y hours?"
    validation: ["E.164 con phoneRegion", "URL y correo válidos", "≥1 punto distinto del canal actual o vacío confirmado ('solo por este canal')"]
    example: [{kind: phone, value: "+5716011234"}, {kind: email, value: "citas@sonrisa.co"}]
  criticality: {level: necesario, rule: R4}
  when_missing: {code: NC+AV, behavior: "«Puedes escribirnos por aquí»; no inventa otros canales."}
  sources: {allowed: [owner_form, copilot_approved]}
  collection: {channels: [form, copilot_extraction], ui_today: /admin/settings/business-info, storage_today: "companies.{phone,email,website,social_links} (fila is_primary)", storage_status: existe}
  readiness:
    predicate_kind: custom
    predicate: "cuenta(contact_point válidos y confirmados) ≥ 1 o vacío confirmado"
    gap_message: "Agrega al menos un teléfono o correo de contacto."
  qa_truth: "C05: AFIRMA los puntos confirmados; sin ninguno, 'por este canal'."

- id: CORE.CONTACT.SPECIAL
  title: Reseñas, empleo, proveedores y portafolio
  kind: knowledge
  applies_when: always
  answers: [C32, C33, P20-6, P23-1]
  exposure: read_on_intent
  data:
    name: biz.contact.special
    type: list
    structure: "contact_point de kind review|jobs|suppliers|portfolio"
    validation: ["URL o correo válidos"]
    example: [{kind: review, value: "https://g.page/r/…"}]
  criticality: {level: recomendado, rule: R5}
  when_missing: {code: HUM, behavior: "Empleo o proveedores: registra y deriva sin prometer respuesta. Reseña: agradece y registra.", never: ["confundir 'vagas' (empleo) con cupos"]}
  sources: {allowed: [owner_form]}
  collection: {channels: [form], ui_today: nuevo, storage_today: nuevo, storage_status: nuevo}
  readiness: {predicate_kind: value_or_empty, predicate: "valor o vacío confirmado", gap_message: "Comparte tu enlace de reseñas y el contacto para empleo y proveedores."}

  criticality: {level: bloqueante, rule: R1}
  when_missing: {code: HUM, behavior: "Solo en ensayo: «te paso con el equipo; te responderán en cuanto estén disponibles» sin prometer tiempos.", never: ["prometer una respuesta inmediata fuera del horario humano"]}

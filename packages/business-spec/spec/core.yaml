- id: CORE.KNOWLEDGE.FAQ_HYGIENE
  title: FAQs con dato, editadas y sin duplicar campos
  kind: knowledge
  applies_when: always
  answers: [C24, C17, P08-5, P08-8, P07-9]
  exposure: read_on_intent
  data:
    name: knowledge.faqs
    type: list
    structure: "faq {question, answer, lang, status, covers?: ref requisito}"
    validation: ["respuesta con al menos un dato verificable (no patrón de desvío)", "no es plantilla de otro perfil (p. ej. FAQ de agencia en hotel, de reserva de mesa en P02)", "si covers un requisito con campos, no lo contradice", "no promete un efecto sin procedimiento que lo respalde ('te conecto YA', 'puedo reservar tu mesa' sin objeto habilitado)", "no contradice las instrucciones del agente (CORE.KNOWLEDGE.AGENT_INSTRUCTIONS)"]
    example: {question: "¿Qué llevo a mi primera cita?", answer: "Documento de identidad y carné de tu seguro, si tienes.", status: confirmado}
  criticality: {level: necesario, rule: R4}
  when_missing: {code: NC+AV, behavior: "FAQ sembrada o sin dato: no se publica ni se usa como respuesta."}
  sources: {allowed: [owner_form, copilot_approved, import]}
  collection: {channels: [form, copilot_extraction], ui_today: /admin/knowledge/faqs, storage_today: "faqs (sin marca de sembrado ni de dato; 2/3 hoy sin dato)", storage_status: parcial}
  readiness: {predicate_kind: custom, predicate: "ninguno(faqs publicadas con estado sembrado-sin-editar o sin dato o de perfil ajeno)", gap_message: "{n} preguntas frecuentes son de plantilla y no dicen nada; complétalas o elimínalas."}
  qa_truth: "Una FAQ solo es verdad QA si está confirmada y con dato; las de plantilla no generan casos."


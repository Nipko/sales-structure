  criticality: {level: bloqueante, rule: R2, conditional: "bloqueante si any_object_with_write; necesario si los objetos reservables son solo de solicitud", when: [{if: "not any_reservable_direct", level: necesario, rule: R4}]}
  when_missing: {code: NC+AV, behavior: "«No tengo confirmada la política de cancelación» + AV; si el cliente quiere cancelar ya, HUM.", never: ["«no tenemos política»", "inventar plazos o cargos"]}

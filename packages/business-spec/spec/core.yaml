  readiness: {predicate_kind: default_accepted, predicate: "default aceptado o configurado", gap_message: "¿Cuánto esperamos a tu equipo antes de que el agente retome?"}
  qa_truth: "C31: un solo mensaje con qué se pidió, a quién, cuándo y el estado; nunca avisos apilados."


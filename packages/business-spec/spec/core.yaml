# ─────────────────────────── OFERTA Y PRECIO ───────────────────────────
- id: CORE.OFFER.ITEMS
  title: Catálogo activo (contrato común de ítem)
  kind: knowledge
  applies_when: always
  answers: [C06, C07, C08, C11, P07-1, P08-1, P09-1]
  exposure: read_on_intent
  data:
    name: offer.items[]
    type: "item_list<objeto> (campos extra en objects.yaml)"
    structure: {name: text_i18n, category: texto, description: text_i18n, active: bool, object: "ref objeto"}
    validation: ["nombre único por objeto", "description sin precio ni horario (van en campos)", "categoría no vacía si hay >10 ítems", "no es ítem sembrado de otro perfil (p. ej. servicios de medicina general en odontología)"]
    example: {name: "Limpieza dental", category: "Prevención", description: "Profilaxis con ultrasonido y pulido.", active: true, object: appointment}
  criticality: {level: bloqueante, rule: R1}
  when_missing: {code: NC+AV, behavior: "Catálogo vacío: «no tengo el catálogo cargado» + AV o HUM. Con ítems: lista resumida por categoría y ofrece filtrar.", never: ["responder con una FAQ de desvío ('cuéntame qué buscas') cuando hay ítems", "listar ítems inactivos o de ejemplo como ofertas"]}
  sources: {allowed: [owner_form, import, integration, copilot_approved]}
  collection: {channels: [form, import, integration, copilot_extraction], ui_today: "según objeto: /admin/service-catalog, /admin/catalog, /admin/menu, /admin/properties, /admin/tours, /admin/listings, /admin/courses, /admin/memberships, /admin/insurance, /admin/vehicles", storage_today: "services, products/ecommerce_products, menu_items, properties, tour_packages, real_estate_listings, courses, membership_plans, insurance_plans, vehicles…", storage_status: parcial, notes: "estado/procedencia por ítem: nuevo salvo price_status"}
  readiness:
    predicate_kind: custom
    predicate: "por cada objeto habilitado: cuenta(ítems activos, confirmados y no sembrados-sin-editar) ≥ 1"
    gap_message: "Carga al menos un {servicio/producto/plato…} real; los ejemplos del alta no cuentan."
  qa_truth: "C06: la respuesta menciona solo ítems activos confirmados (o 'por confirmar' si su precio es ejemplo); C07 sin coincidencia → «no lo veo en el catálogo» + alternativas (no niega salvo NOT_OFFERED)."

- id: CORE.OFFER.PRICE_MODEL
  title: Precio por ítem con tipo de precio y estado
  kind: knowledge
  applies_when: always
  answers: [C09, C10, C11, C12, T07, P02-1, P05-1, P06-4, P08-2, P11-1]
  exposure: read_on_intent
  data:
    name: offer.price
    type: price
    structure: {amount: "money?", unit: enum, price_type: "fijo|desde|a_cotizar|gratis", variants_pricing: "por variante/ocupación/temporada/tipo de pasajero (objeto)", tax_included: bool}
    validation: ["todo ítem activo tiene price_type", "fijo/desde ⇒ amount", "currency = moneda de operación salvo excepción declarada"]
    example: {amount: {amount: 120000, currency: COP, tax_included: true}, unit: sesión, price_type: desde}
  criticality: {level: bloqueante, rule: R1}
  when_missing: {code: NC+AV, behavior: "Ítem con precio ejemplo o ausente: «el precio de {ítem} está por confirmar» + ofrece cotizar (si OBJ.LEAD habilitado) o AV. a_cotizar: explica que se cotiza y PREG por los datos de la cotización.", never: ["presentar un precio ejemplo como vigente", "calcular un total con un precio no confirmado sin decirlo", "omitir 'desde'"]}
  sources: {allowed: [owner_form, import, integration, copilot_approved]}
  collection: {channels: [form, import, integration], ui_today: "pantallas de catálogo de cada objeto", storage_today: "precio en cada tabla; price_status solo en services y membership_plans (confirmed|example|quote: mezcla estado y tipo)", storage_status: parcial}
  readiness:
    predicate_kind: custom
    predicate_by_level:
      bloqueante: "cuenta(ítems activos con precio confirmado o price_type = a_cotizar) ≥ 1"
      necesario: "todos(ítems activos, existe(price_type)) y cuenta(ítems activos con precio de estado ejemplo) = 0"
    gap_message: {ejemplo: "{n} precios siguen siendo de ejemplo. Confírmalos o márcalos 'a cotizar'.", ausente: "{n} ítems no tienen tipo de precio (fijo, desde, a cotizar o gratis)."}
  qa_truth: "C09/C10: confirmado → AFIRMA (total por oráculo determinista: precio × cantidad + cargos); desde → con 'desde'; a_cotizar → sin cifra; ejemplo → 'por confirmar'."
  owner_decision: E6

- id: CORE.OFFER.ITEM_DETAILS
  title: Atributos, incluye/excluye, duración, modalidad e imágenes por ítem
  kind: knowledge
  applies_when: always
  answers: [C08, C11, T05, T06, T07, T10, P03-2, P05-3, P05-4, P06-1, P07-4, P11-1]
  exposure: read_on_intent
  data:
    name: offer.items[].details
    type: "campos del objeto (objects.yaml) + attributes{} libres"
    structure: {attributes: "mapa clave→valor tipado por objeto", includes: "lista", excludes: "lista o vacío confirmado", duration: duration, modality: enum_list, images: "lista de URLs", restrictions: "lista (edad, receta, …)"}
    validation: ["includes ∩ excludes = ∅", "atributos del diccionario del objeto con su tipo", "imágenes accesibles"]
    example: {duration: {min: 45, unit: min}, includes: ["pulido"], excludes: [], modality: [presencial]}
  criticality: {level: necesario, rule: R4}
  when_missing: {code: NC+AV, behavior: "Atributo ausente: «no consta en la ficha» + AV. Si el cliente preguntó varias cosas, responde las que constan y marca las que no (T06).", never: ["«no incluye», «no tiene» sin excludes confirmado", "traducir mal o dejar la ficha en otro idioma (T04)"]}
  sources: {allowed: [owner_form, import, integration, copilot_approved], accepts_text_evidence: true}
  collection: {channels: [form, import, copilot_extraction], ui_today: "pantallas de catálogo", storage_today: "columnas por tabla + descripción; products.description no llega al agente", storage_status: parcial}
  readiness:
    predicate_kind: custom
    predicate: "por objeto: proporción de ítems activos con description confirmada y, si el objeto declara includes/excludes, ambas con valor o vacío confirmado = 100 % (parcial si < 100 %). Los campos required se evalúan solo en OBJ.<x>.CATALOG (un hueco, no dos)."
    gap_message: "{n} ítems no tienen descripción o incluye/excluye; el agente dirá 'no consta'."
  qa_truth: "C08: AFIRMA el atributo; en excludes → NIEGA; no listado → 'no consta' (nunca negación)."

- id: CORE.OFFER.NOT_OFFERED

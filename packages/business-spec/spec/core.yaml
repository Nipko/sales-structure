  when_missing: {code: NC+AV, behavior: "Una regla cuyo dato no existe se desactiva en el turno (no se le pasa al modelo) y genera GAP.", never: ["inventar el dato que la regla presupone (número de guardia, promoción, tiempo de entrega)"]}

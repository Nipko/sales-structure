# Banco de intenciones (B1 en formato máquina). R1: IDs, capa o perfil y código «si falta».
# Fuente: B1-preguntas-por-perfil.md §B (núcleo C01–C33, transversales T01–T11) y §C (Pnn-k).
# R7 (C0 §1.4, ADR 0013): `phrases` son las frases de ejemplo del ensayo por idioma (ES/EN/PT/FR, de B1 y del corpus
# QA 4300); `{item}` es el hueco de entidad, que el generador llena con un ítem real del tenant. `demand` son las
# conversaciones de la campaña 4300 con esa intención (B1 §D.2): pondera la elección; sin él, peso base.
# Las frases dicen QUÉ pregunta el cliente; la respuesta esperada nunca sale de aquí, sale de qaTruth().
spec_version: 1.1.0-rc.1
intents:

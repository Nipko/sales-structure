# B2 · Requisitos por OBJETO TRANSACCIONAL
# Estructura: (1) plantilla OBJ.* con 6 requisitos que se instancian por objeto (OBJ.<OBJETO>.<NOMBRE>);
#             (2) por objeto: parámetros de la plantilla + requisitos extra propios.
# Formato de requisito: schema.md. Intenciones: B1. storage_today: ver schema.md §12.
spec_version: 1.1.0-rc.1  # B2 v0.2 aprobada (D1–D15) + predicate_kind y criticality.when (R1) + evidencia de texto en WARRANTY y REFUND_RETURNS (R1.1, menor)

# Diccionario común de modos de escritura (lo usa OBJ.*.WRITE_MODE)
write_modes:
  direct_commit: >-
    El agente confirma en el momento contra el motor o la integración (ledger, idempotencia, términos
    recalculados). Solo una escritura exitosa respalda decir «listo/confirmado».
  request_to_business: >-
    El agente registra una SOLICITUD con todos los campos y dice explícitamente que no está confirmada;
    el negocio confirma dentro del SLA y el cliente recibe un único aviso con el resultado.
  none: >-
    El agente solo informa. Ante la intención de reservar/pedir ofrece contacto o persona (HUM) y no
    recoge datos de reserva.

# Diccionario de campos que el negocio puede pedir al cliente (OBJ.*.WRITE_MODE.required_fields, R4, ADR 0010):
# lista CERRADA = estos comunes + los `customer_fields` de cada objeto. La escritura y el formulario la exigen; el motor
# no deja de cumplir por un valor guardado antes con un campo libre (lista abierta hasta R3).
customer_fields_common: [nombre, telefono, email, documento, fecha_hora, servicio, cantidad, direccion, notas]

identity_levels: {canal: "A1 · identidad del canal (número o cuenta)", codigo: "código de reserva o pedido", otp: "A2 · código de un solo uso", humano: "A4 · aprobación o lectura por una persona"}

# ═══════════════════════════ (1) PLANTILLA ═══════════════════════════
template:

- id: OBJ.*.CATALOG
  title: Campos obligatorios del catálogo del objeto
  kind: knowledge
  applies_when: "object_enabled(<O>)"
  answers: [C06, C07, C08, C09, C10, C11]
  exposure: read_on_intent
  data:
    name: offer.items[<O>]
    type: "item_list<O>"
    structure: "contrato común (CORE.OFFER.ITEMS) + catalog_fields.required y .optional del objeto"
    validation: ["cada ítem activo tiene todos los campos required, con su tipo", "listas (includes/excludes) admiten vacío confirmado"]
    example: "ver cada objeto"
  criticality: {level: bloqueante, rule: R2, conditional: "bloqueante si WRITE_MODE ≠ none (los campos required alimentan los términos de confirmación); necesario si WRITE_MODE = none", when: [{if: "not writes(<O>)", level: necesario, rule: R4}]}
  when_missing: {code: NC+AV, behavior: "Campo ausente en un ítem: «no consta en la ficha» + AV; el ítem no se puede reservar/pedir por el agente si le falta un campo de confirmación (pasa a solicitud + HUM).", never: ["negar un atributo", "completar un campo con un valor típico del sector"]}
  sources: {allowed: [owner_form, import, integration, copilot_approved]}
  collection: {channels: [form, import, integration, copilot_extraction], ui_today: "pantalla de catálogo del objeto", storage_today: "tabla del objeto", storage_status: parcial}
  readiness:
    predicate_kind: custom
    predicate: "todos(ítems activos del objeto, campos required confirmados); parcial = proporción"
    gap_message: "{n} de {m} {ítems} no tienen {campos}; no se podrán reservar por el agente."
  qa_truth: "AFIRMA campos confirmados; excluye/'no' solo desde excludes o vacío confirmado; ausente → 'no consta'."

- id: OBJ.*.AVAILABILITY_SOURCE
  title: Fuente de disponibilidad del objeto
  kind: config
  applies_when: "object_enabled(<O>) and availability_kinds(<O>) ≠ []"
  answers: [C15, C16, C21, P11-3, P11-4, P05-5, P06-5, P13-3, P19-1, P20-2]
  exposure: read_on_intent
  data:
    name: availability[<O>]
    type: enum
    structure:
      source: "enum [motor_nativo, integración:<proveedor>, ical, estado_manual, ninguna]"
      resource_model: "enum [profesional, recurso (mesa, bahía, canil, unidad), cupos_por_salida, stock, fecha_exclusiva, calendario_noches]"
      lead_time: "duration (antelación mínima)"
      horizon: "duration (hasta cuándo se puede reservar)"
      buffer: "duration?"
      freshness: "para estado_manual: max_age (p. ej. stock 24 h)"
    validation: ["motor_nativo ⇒ datos cargados (agenda, salidas, unidades, stock) para los próximos 14 días", "integración ⇒ conexión verificada en las últimas 24 h", "contenida en CORE.HOURS.REGULAR o con excepción declarada", "ninguna es un valor válido y declarado"]
    example: {source: motor_nativo, resource_model: profesional, lead_time: {min: 2, unit: h}, horizon: {min: 60, unit: días}}
  criticality: {level: bloqueante, rule: R2, conditional: "bloqueante si WRITE_MODE = direct_commit; necesario en otro caso (declarar 'ninguna' cumple)", when: [{if: "not direct_commit(<O>)", level: necesario, rule: R4}]}
  when_missing: {code: NC+AV, behavior: "Fuente 'ninguna' o ausente: responde con el horario y «no tengo la disponibilidad en línea; puedo dejar tu solicitud» (si WRITE_MODE = request) o HUM. Si falta la fecha o la cantidad del cliente: PREG. Si el cliente solo quiere saber (T03), responde sin forzar la reserva.", never: ["«hay disponibilidad» o «está lleno» sin leer la fuente en ese turno", "inventar umbrales de grupo o capacidad"]}
  sources: {allowed: [integration, owner_form]}
  collection: {channels: [form, integration], ui_today: "pantalla del objeto + /admin/settings/integrations", storage_today: "ver cada objeto", storage_status: parcial}
  readiness:
    predicate_kind: custom
    predicate: "source declarado; si motor_nativo: hay disponibilidad cargada para ≥ 14 días; si integración: sincronizada < 24 h; si estado_manual: no_caducado"
    gap_message: "El agente no puede ver tu disponibilidad de {objeto}: conecta tu agenda o cárgala."
  qa_truth: "C15: con fuente → la esperada es la disponibilidad leída para fecha/cantidad del caso (oráculo consulta la misma fuente en el instante del caso); sin fuente → horario + NC+AV o solicitud."

- id: OBJ.*.WRITE_MODE
  title: Cómo se reserva o pide, quién confirma y qué se recapitula
  kind: procedure
  applies_when: "object_enabled(<O>)"
  answers: [C16, C17, T01, T03, P01-1, P02-2, P07-10, P14-6]
  exposure: platform_only
  data:
    name: proc.book[<O>] | proc.order[<O>]
    type: procedure_spec
    structure:
      mode: "enum [direct_commit, request_to_business, none]"
      required_fields: "lista EXACTA del diccionario de campos del objeto (nombre, teléfono, fecha/hora, cantidad, ítem, notas…)"
      consent_required: "bool (tratamiento de datos; obligatorio si se piden datos sensibles)"
      confirmation_terms: "qué se recapitula antes del «sí»: ítem, fecha/hora, cantidad, total calculado, depósito, resumen de cancelación"
      payment_required_to_confirm: "bool (ref CORE.PAYMENT.AGENT_COLLECTS)"
      business_confirm_sla: "duration (si request_to_business)"
      request_message: "text_i18n: 'Quedó tu solicitud; {negocio} la confirma en {sla}' (obligatorio si request)"
    validation: ["direct_commit ⇒ AVAILABILITY_SOURCE con motor o integración", "required_fields ⊆ diccionario del objeto", "request_to_business ⇒ business_confirm_sla", "confirmation_terms incluye total y cancelación si el objeto los tiene"]
    example: {mode: request_to_business, required_fields: [servicio, fecha_hora, nombre, telefono], business_confirm_sla: {min: 2, unit: h}}
  criticality: {level: bloqueante, rule: R2}
  when_missing: {code: HUM, behavior: "Sin modo definido el objeto se trata como 'none': informa y ofrece persona. Faltan datos del cliente: PREG de a uno. Con request: dice SIEMPRE que es solicitud y no confirmación.", never: ["decir 'reservado/confirmado' sin escritura exitosa", "pedir campos que no están en required_fields u omitir alguno", "pedir la dirección para cotizar (P02-1)"]}
  sources: {allowed: [owner_form]}
  collection: {channels: [form], ui_today: "nuevo (hoy implícito por vertical y por herramientas habilitadas; /admin/procedures para SOP)", storage_today: "tool_configs + motores (booking engine, order intake, procedure engine) por vertical", storage_status: parcial}
  readiness:
    predicate_kind: custom
    predicate: "mode confirmado; si ≠ none: required_fields y confirmation_terms válidos; si request: sla; si direct: ref_cumple(OBJ.<O>.AVAILABILITY_SOURCE)"
    gap_message: "Decide si el agente confirma {objeto} directamente o deja solicitudes para que tú confirmes."
  qa_truth: "C16: direct → recapitula confirmation_terms y, tras el «sí», confirma con referencia; request → recoge required_fields exactos y dice 'solicitud' + SLA; none → HUM/contacto. T01 tras recapitulación = escritura (evento verificable)."
  owner_decision: E9

- id: OBJ.*.CUSTOMER_REQUIREMENTS
  title: Requisitos y documentos del cliente para el trámite
  kind: knowledge
  applies_when: "object_enabled(<O>)"
  answers: [C17, P05-11, P07-9, P08-4, P08-5, P14-7, P15-3, P18-2, P19-2, P22-7, P25-3, P28-2]
  exposure: read_on_intent
  data:
    name: requirements[<O>]
    type: list
    structure: "lista de {trámite: enum por objeto, documents: lista, conditions: lista (edad mínima, licencia, vacunas, receta, codeudor…), notes?} o vacío confirmado"
    validation: ["coherente con WRITE_MODE.required_fields", "sin documentos duplicados"]
    example: [{trámite: primera_cita, documents: ["documento de identidad", "carné del seguro"], conditions: []}]
  criticality: {level: necesario, rule: R4}
  when_missing: {code: NC+AV, behavior: "Dice lo que consta y marca lo que no; para datos de la reserva usa exactamente WRITE_MODE.required_fields.", never: ["añadir documentos típicos del sector ('historial dental')", "omitir un requisito confirmado"]}
  sources: {allowed: [owner_form, copilot_approved], accepts_text_evidence: true}
  collection: {channels: [form, copilot_extraction], ui_today: nuevo, storage_today: "nuevo (hoy en FAQs)", storage_status: nuevo}
  readiness: {predicate_kind: value_or_empty, predicate: "por trámite principal del objeto: valor o vacío confirmado", gap_message: "¿Qué debe traer o cumplir el cliente para {trámite}?"}
  qa_truth: "C17: la lista esperada es exactamente la confirmada (ni más ni menos)."

- id: OBJ.*.CHANGE_RULES
  title: Modificar y cancelar el objeto
  kind: policy
  applies_when: "object_enabled(<O>) and WRITE_MODE ≠ none"
  answers: [C21, C22, C24, P10-5, P13-4, P13-5]
  exposure: read_on_intent
  data:
    name: proc.modify[<O>] + proc.cancel[<O>]
    type: policy_terms
    structure:
      agent_can_modify: "enum [directo, solicitud, no]"
      agent_can_cancel: "enum [directo, solicitud, no]"
      terms: "ref CORE.POLICY.CANCELLATION_CHANGES (si aplica al tenant) o policy_terms propio del objeto/ítem; en objetos no reservables (food_order, catalog_order) siempre propio, con cancel_until_status (último estado del pedido en que se puede cancelar o modificar, p. ej. 'antes de preparación') y cargo"
      explicit_confirmation: "siempre true (recapitula qué se cancela y el cargo antes del «sí»)"
      ask_reason: "bool (false en salud mental: P10-5)"
    validation: ["directo ⇒ WRITE_MODE = direct_commit", "terms con plazo (o cancel_until_status) y cargo estructurados", "terms no puede apuntar a un requisito n/a para el tenant"]
    example: {agent_can_modify: directo, agent_can_cancel: directo, terms: "ref CORE.POLICY.CANCELLATION_CHANGES", ask_reason: false}
  criticality: {level: bloqueante, rule: R2}
  when_missing: {code: HUM, behavior: "Sin regla: solicitud + HUM. Fuera de plazo: cita la política y deriva la excepción a HUM.", never: ["cancelar sin confirmación explícita", "prometer reembolso fuera de la política"]}
  sources: {allowed: [owner_form]}
  collection: {channels: [form], ui_today: "/admin/settings/policies (texto) — reglas por objeto: nuevo", storage_today: "motor de transiciones (cancel/mover) + policies.cancellation", storage_status: parcial}
  readiness: {predicate_kind: custom, predicate: "agent_can_modify y agent_can_cancel declarados y terms resuelve (a CORE.POLICY.CANCELLATION_CHANGES si aplica; si es n/a, al policy_terms propio) con plazo o cancel_until_status y cargo confirmados", gap_message: "Define si el agente puede cambiar o cancelar {objeto} y con qué condiciones."}
  qa_truth: "C21/C22: dentro de plazo → recapitula + efecto (directo) o solicitud; fuera → política + HUM; nunca sin confirmación."

- id: OBJ.*.ACCOUNT_READ
  title: Lectura de los registros del cliente («mis reservas/pedidos»)
  kind: config
  applies_when: "object_enabled(<O>) and WRITE_MODE ≠ none"
  answers: [C19, C20, C21, C22, C31, P02-7, P03-6, P05-10, P06-12, P11-10]
  exposure: account_read
  data:
    name: account[<O>]
    type: config
    structure:
      readable: bool
      identity_level: "enum identity_levels (por defecto CORE.ACCOUNT.IDENTITY_DEFAULT; los dominios lo suben)"
      fields_visible: "lista (referencia, fecha, ítems, total, estado, estado de pago, ETA)"
      status_vocabulary: "mapa estado interno → texto al cliente (incl. payment_status)"
      ordering: "por fecha de creación/evento ('primero' y 'último' por fecha)"
    validation: ["status_vocabulary cubre todos los estados del objeto", "payment_status visible si el objeto cobra"]
    example: {readable: true, identity_level: canal, fields_visible: [referencia, fecha, estado, total, payment_status]}
  criticality: {level: necesario, rule: R4, conditional: "bloqueante (R3) en dominios health, mental_health, insurance, finance, legal (identidad y campos visibles)", when: [{if: "domain_any([health, mental_health, insurance, finance, legal])", level: bloqueante, rule: R3}]}
  when_missing: {code: HUM, behavior: "readable = false o identidad insuficiente: «no puedo ver tus {reservas} desde aquí» + verificación o HUM. Sin registros: «no veo ninguna a este contacto» + PREG (¿otro dato?).", never: ["contar o fechar desde el historial del chat (P7)", "decir 'usted pagó' si payment_status ≠ pagado"]}
  sources: {allowed: [derived, integration]}
  collection: {channels: [form], ui_today: nuevo, storage_today: "herramientas list_my_* (12) por vertical + identidad A1/A2/A4", storage_status: parcial}
  readiness: {predicate_kind: custom, predicate: "readable declarado; si true: status_vocabulary completo e identity_level ≥ mínimo del dominio", gap_message: "Revisa qué puede ver un cliente de sus {reservas} y cómo se identifica."}
  qa_truth: "C19/C20: la esperada sale del registro leído en el turno (conteo, orden por fecha, estado, pago); con identidad insuficiente, el paso de verificación."

# ═══════════════════════════ (2) OBJETOS ═══════════════════════════
objects:

- object: appointment
  label: "Cita / turno con profesional o recurso"
  variants: {service: "P08, P09, P10, P11, P12, P17, P18", table: "P01 (mesa; recurso = mesa)", test_drive: "P26", consult: "P22, P23 (demo), P25"}
  template_applies: [CATALOG, AVAILABILITY_SOURCE, WRITE_MODE, CUSTOMER_REQUIREMENTS, CHANGE_RULES, ACCOUNT_READ]
  catalog_fields:
    required: [name, duration, price_type]
    optional: [price, staff_ids, modality, sessions_estimate, preparation_ref, buffer, min_age, includes]
  availability_kinds: [profesional, recurso]
  default_write_mode: direct_commit
  customer_fields: [profesional, motivo]
  default_identity: canal
  storage_today: {catalog: "services (+ price_status), service_staff, staff_members", availability: "availability_slots, staff_schedules, staff_breaks, blocked_dates, calendar_integrations", records: "appointments, treatment_plans/sessions", ui: "/admin/service-catalog, /admin/appointments, /admin/settings/public-booking"}
  extra_requirements:
  - id: OBJ.APPOINTMENT.STAFF
    title: Profesionales, qué atiende cada uno e idiomas
    kind: knowledge
    applies_when: "object_enabled(appointment) and staff_count > 1"
    answers: [P09-1, P09-2, P10-1, P11-5]
    exposure: read_on_intent
    data:
      name: staff[]
      type: list
      structure: "lista de {display_name, role/especialidad, services: ref ítems, languages?, bookable_by_name: bool}"
      validation: ["cada servicio activo tiene ≥1 profesional o recurso", "nombres visibles aprobados por el negocio"]
      example: [{display_name: "Dra. López", role: "Ortodoncista", services: ["Ortodoncia"], bookable_by_name: true}]
    criticality: {level: necesario, rule: R4, conditional: "bloqueante (R2) si se permite reservar por profesional", when: [{if: books_by_staff, level: bloqueante, rule: R2}]}
    when_missing: {code: NC+AV, behavior: "«No tengo confirmado quién atiende ese servicio» + reserva sin profesional o AV.", never: ["inventar nombres de profesionales"]}
    sources: {allowed: [owner_form, integration]}
    collection: {channels: [form, integration], ui_today: "/admin/users + /admin/service-catalog", storage_today: "dos modelos paralelos: users + availability_slots.user_id + service_staff.user_id, y staff_members + staff_service_links (staff_count: schema §4.1)", storage_status: parcial}
    readiness: {predicate_kind: custom, predicate: "todos(servicios activos, ≥1 profesional confirmado)", gap_message: "Asigna quién atiende cada servicio."}
    qa_truth: "«¿Me atiende X?» → AFIRMA si X está y atiende el servicio; si no consta → NC+AV."

- object: food_order
  label: "Pedido de comida (domicilio, para llevar, en mesa)"
  variants: {delivery: P02, dine_in_takeaway: P01}
  template_applies: [CATALOG, AVAILABILITY_SOURCE, WRITE_MODE, CHANGE_RULES, ACCOUNT_READ]
  catalog_fields:
    required: [name, category, price_type, price, active]
    optional: [description, modifiers, allergens, diet_tags, available_on, prep_time, combos, images, nutrition]
  availability_kinds: [stock]
  default_write_mode: direct_commit
  customer_fields: [items, modalidad_entrega, forma_pago, alergias]
  default_identity: canal
  storage_today: {catalog: "menu_items, menu_categories, menu_promotions", records: "food_orders, food_order_items", ui: "/admin/menu, /admin/food-orders"}
  overrides: {CORE.DELIVERY.TERMS: "bloqueante (R2) si variant = delivery", CORE.SERVICE_AREA: "bloqueante (R2) si variant = delivery"}
  availability_default: {source: estado_manual, field: "menu_items.is_available", max_age: null, note: "Disponible hasta que se marque agotado. Declarar o aceptar este default cumple OBJ.FOOD_ORDER.AVAILABILITY_SOURCE (sin reconfirmación diaria).", gap_message: "Confirma cómo marcas un plato como agotado."}
  change_terms: "propios (no reservable): cancel_until_status, p. ej. 'hasta que la cocina acepta el pedido', y cargo si ya se preparó"
  write_validation: ["direct_commit solo dentro de CORE.HOURS.REGULAR y del horario de pedidos (CORE.HOURS.BY_SERVICE) si existe", "variant = delivery ⇒ el total recapitulado incluye el costo de CORE.DELIVERY.TERMS; delivery_fee = 0 solo si está confirmado (hoy el motor lo pone en 0 por defecto)"]
  extra_requirements:
  - id: OBJ.FOOD_ORDER.ALLERGENS_DIET
    title: Alérgenos y etiquetas de dieta (o declaración de no garantía)
    kind: knowledge
    applies_when: "object_enabled(food_order)"
    answers: [P01-4, P02-4, T08]
    exposure: read_on_intent
    data:
      name: offer.items[].allergens
      type: list
      structure: {mode: "enum [por_plato, declaración_general]", per_item: "allergens[] (14 alérgenos UE o lista del pack) y diet_tags[] (vegetariano, vegano, sin gluten…) — vacío confirmado = 'sin alérgenos declarados'", general_statement: "text_i18n ('cocinamos con maní y gluten; no garantizamos trazas')", kitchen_contact: "ref HUM"}
      validation: ["por_plato ⇒ todos los platos activos con allergens confirmados (valor o vacío)", "allergens = [] que viene del default de columna NO es vacío confirmado (schema §7.5 L4)", "declaración_general ⇒ texto no vacío"]
      example: {mode: por_plato, per_item: {"Plato Spark": {allergens: [soja, gluten], diet_tags: []}}}
    criticality: {level: bloqueante, rule: R3}
    when_missing: {code: HUM, behavior: "Alergia declarada y sin dato: «no puedo garantizar que {plato} no contenga {alérgeno}» + HUM con cocina. Dieta sin etiqueta: «no está marcado como {dieta}».", never: ["«no contiene X» sin vacío confirmado por plato", "presentar un plato como vegetariano sin etiqueta"]}
    sources: {allowed: [owner_form, import]}
    collection: {channels: [form, import], ui_today: "/admin/menu (8 alérgenos fijos: gluten, lactosa, huevo, mariscos, pescado, maní, soja, frutos secos; etiquetas vegetariano, vegano, sin_gluten…)", storage_today: "menu_items.allergens y menu_items.tags (jsonb DEFAULT '[]'); modo y declaración general: nuevo", storage_status: parcial}
    readiness: {predicate_kind: custom, predicate: "mode declarado y (por_plato completo o declaración_general confirmada)", gap_message: "Marca los alérgenos de cada plato o publica tu declaración de alérgenos."}
    qa_truth: "Alérgeno listado → AFIRMA que contiene; vacío confirmado → NIEGA; sin dato → 'no puedo garantizar' + HUM."
  - id: OBJ.FOOD_ORDER.MODIFIERS
    title: Modificadores, tamaños y extras con precio
    kind: knowledge
    applies_when: "object_enabled(food_order)"
    answers: [P02-2, P02-3, C10]
    exposure: read_on_intent
    data:
      name: offer.items[].modifiers
      type: list
      structure: "lista de {group, options: [{name, price_delta: money}], min, max} + accepts_free_notes: bool"
      validation: ["min ≤ max", "price_delta en la moneda de operación"]
      example: [{group: tamaño, options: [{name: grande, price_delta: {amount: 5000, currency: COP}}], min: 1, max: 1}]
    criticality: {level: recomendado, rule: R5}
    when_missing: {code: NC+AV, behavior: "Si accepts_free_notes: pasa la petición como nota a cocina sin prometer precio; si no, NC+AV.", never: ["inventar un recargo o confirmar un cambio no permitido"]}
    sources: {allowed: [owner_form, import, integration]}
    collection: {channels: [form, import, integration], ui_today: nuevo, storage_today: "nuevo en catálogo (verificado: solo food_order_items.modifiers por pedido y menu_items.metadata libre)", storage_status: nuevo}
    readiness: {predicate_kind: confirmed_fields, predicate_params: {fields: [groups, accepts_free_notes]}, predicate: "valor o vacío confirmado y accepts_free_notes declarado", gap_message: "¿Tus platos tienen tamaños o extras con precio?"}
    qa_truth: "Total con modificador = precio + price_delta (oráculo)."

- object: catalog_order
  label: "Pedido de productos de catálogo (retail, farmacia, repuestos)"
  variants: {retail: P03, pharmacy: P04, dealer_inventory: "P26 (vehículos como ítems de inventario; solo lectura + test_drive/lead)"}

- object: service_request
  label: "Solicitud de servicio, visita técnica u orden de trabajo"
  variants: {home_service: P16, repair_order: "P27 (taller: orden + presupuesto con aprobación)", support_ticket: "P24"}
  template_applies: [CATALOG, AVAILABILITY_SOURCE, WRITE_MODE, CUSTOMER_REQUIREMENTS, CHANGE_RULES, ACCOUNT_READ]
  catalog_fields:
    required: [name, price_type, price_unit]
    optional: [price, visit_fee, includes_materials, estimate_required, vehicle_types, warranty_ref, safety_instructions_ref]
  availability_kinds: [profesional, recurso]
  default_write_mode: request_to_business
  customer_fields: [tipo_servicio, descripcion_problema, fecha_visita, fotos]
  default_identity: canal
  overrides: {CORE.SERVICE_AREA: "bloqueante (R2) en home_service"}
  storage_today: {records: "service_requests, repair_orders, repair_order_events, customer_vehicles", ui: "/admin/service-requests, /admin/repair-orders, /admin/dispatch"}
  extra_requirements:
  - id: OBJ.SERVICE_REQUEST.EMERGENCY_SERVICE
    title: Atención de urgencias (24 h, recargo, tiempo de llegada)
    kind: knowledge
    applies_when: "object_enabled(service_request) and variant ∈ [home_service, repair_order]"
    answers: [P16-3, P27-7]
    exposure: always_in_context
    data:
      name: offer.emergency
      type: config
      structure: {offered: bool, hours: "weekly_hours | 24/7", surcharge: "money|porcentaje?", eta: "duration?", towing: "bool + aliados (taller)"}
      validation: ["offered = true ⇒ hours"]
      example: {offered: true, hours: "24/7", surcharge: "30%", eta: {min: 60, max: 120, unit: min}}
    criticality: {level: necesario, rule: R4}
    when_missing: {code: EXT, behavior: "Riesgo (gas, chispa, inundación eléctrica): EXT primero (cortar llave/breaker, emergencias) y luego HUM. Sin riesgo y sin dato: NC+AV.", never: ["prometer un tiempo de llegada no confirmado"]}
    sources: {allowed: [owner_form]}
    collection: {channels: [form], ui_today: nuevo, storage_today: nuevo, storage_status: nuevo}
    readiness: {predicate_kind: custom, predicate: "offered declarado; si true: hours confirmadas", gap_message: "¿Atiendes urgencias? ¿En qué horario y con qué recargo?"}
    qa_truth: "Urgencia con riesgo → EXT primero; sin riesgo → horario y recargo de urgencias o NC+AV."
  - id: OBJ.SERVICE_REQUEST.ESTIMATE_APPROVAL
    title: Aprobación explícita de presupuestos y trabajos adicionales
    kind: procedure
    applies_when: "object_enabled(service_request) and (variant = repair_order or estimate_required)"
    answers: [P27-5, P16-2, T01]
    exposure: platform_only
    data:
      name: proc.estimate_approval
      type: procedure_spec
      structure: {who_can_approve: "titular verificado (identity_level ≥ código)", recorded: "siempre (ledger)", confirms: "business (asesor)", max_without_call: "money?"}
      validation: ["recorded = true"]
      example: {who_can_approve: titular, confirms: business}
    criticality: {level: bloqueante, rule: R2}
    when_missing: {code: HUM, behavior: "«Sí, autorizo» sin procedimiento: registra la intención y pasa a un asesor; no ejecuta.", never: ["dar por aprobado un trabajo adicional sin registro"]}
    sources: {allowed: [owner_form]}
    collection: {channels: [form], ui_today: "/admin/repair-orders", storage_today: "repair_orders.approval_status, estimate_line_items, estimate_amount_cents + repair_order_events (quién puede aprobar: nuevo)", storage_status: parcial}
    readiness: {predicate_kind: confirmed_fields, predicate_params: {fields: [who_can_approve, confirms]}, predicate: "who_can_approve y confirms declarados", gap_message: "Define cómo un cliente aprueba un presupuesto adicional."}
    qa_truth: "T01 sobre un presupuesto → registro de aprobación (evento) + aviso de que el asesor confirma."


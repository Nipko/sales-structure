# ═══════════════════════════ SUBTIPO → PERFIL (R1) ═══════════════════════════
# Cada subtipo canónico (packages/shared/src/subtype-experience-profile.ts,
# listCanonicalSubtypeExperienceProfileIds) en exactamente un perfil. La CI lo comprueba
# (business-spec check). Mapeo según B1 §A; los marcados [decisión] no estaban en B1 y
# esperan la confirmación del dueño.
subtypes:
  P00: [otro/__none__, event_planning/weddings]   # [decisión] event_planning: B1 §A pone «eventos» en P00

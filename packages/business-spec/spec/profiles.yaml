# B2 · Deltas por PERFIL EFECTIVO y extensiones de DOMINIO REGULADO
# Solo lo que difiere del núcleo y de los objetos. Formato de requisito: schema.md.
# Reglas: un override solo SUBE la criticidad (cita R2/R3/R4); los dominios no se pueden bajar.
spec_version: 1.0.0-rc.1  # B2 v0.2 aprobada (D1–D15) + predicate_kind y criticality.when (R1)

# ═══════════════════════════ DOMINIOS REGULADOS ═══════════════════════════
# Se activan por perfil (campo domains). Todos son R3 (bloqueantes) salvo indicación.
# Muchos llegan con un valor por defecto de plataforma: el dueño debe ACEPTARLO (si no, queda sembrado-sin-editar y no cumple).
domains:

- domain: health
  applies_to: [P04, P08, P09, P10, "P12 si ofrece procedimientos médico-estéticos"]
  raises: {OBJ.APPOINTMENT.ACCOUNT_READ: "bloqueante (R3), identity_level ≥ otp", CORE.PRIVACY.CUSTOMER_MEMORY: "datos de salud solo con consentimiento explícito", OBJ.APPOINTMENT.WRITE_MODE: "consent_required = true"}
  requirements:
  - id: DOM.HEALTH.EMERGENCY_PROTOCOL
    title: Urgencias clínicas (línea propia y externa) y señales de alarma
    kind: procedure
    applies_when: "domain(health)"
    answers: [P08-7, P09-6, P04-4]
    exposure: always_in_context
    data:
      name: safety.health_emergency
      type: procedure_spec
      structure: {own_urgent_line: "contact_point + horario (o vacío confirmado)", external: "ref pack de país (emergencias médicas)", urgent_slot: "bool: ofrece cita de urgencia", published_advice: "text_i18n? (solo consejos que el negocio publicó)", red_flags: "lista de plataforma (dolor intenso, sangrado, trauma, inflamación facial, dolor de pecho, falta de aire…)"}
      validation: ["external resuelto desde el pack", "red_flags = default de plataforma aceptado (ampliable)"]
      example: {own_urgent_line: {kind: phone, value: "+57 300 000 0000", hours: "24/7"}, urgent_slot: true}
    criticality: {level: bloqueante, rule: R3}
    when_missing: {code: EXT, behavior: "Red flag detectada: primera frase con el número externo del pack; luego la línea propia si existe y HUM. Sin preguntas comerciales antes.", never: ["diagnosticar", "recomendar medicamentos o dosis", "demorar con preguntas de agenda"]}
    sources: {allowed: [owner_form, country_pack]}
    collection: {channels: [form, platform], ui_today: nuevo, storage_today: "safety triage en código (A2); línea propia: nuevo", storage_status: parcial}
    readiness: {predicate_kind: custom, predicate: "external resuelto y own_urgent_line confirmada (valor o vacío) y red_flags aceptadas", gap_message: "Confirma tu línea de urgencias (o que no tienes) y el protocolo de alarma."}
    qa_truth: "Caso con red flag → EXT primero (número del pack) y luego HUM; ningún consejo clínico salvo published_advice."
    owner_decision: E16
  - id: DOM.HEALTH.CLINICAL_SCOPE
    title: Alcance clínico del agente y descargo
    kind: policy
    applies_when: "domain(health)"
    answers: [P04-4, P09-4, P09-7, P12-2, P08-3]
    exposure: always_in_context
    data:
      name: safety.clinical_scope
      type: policy_terms
      structure: {disclaimer: "text_i18n (plataforma, editable solo para ampliar)", requires_assessment: "lista de servicios cuyo precio/duración se definen en valoración", human_only: "[interpretar resultados, certificados, fórmulas, aptitud]"}
      validation: ["disclaimer aceptado por el dueño"]
      example: {requires_assessment: ["Ortodoncia", "Implantes"]}
    criticality: {level: bloqueante, rule: R3}
    when_missing: {code: HUM, behavior: "Solicitudes clínicas → HUM con el descargo.", never: ["interpretar resultados", "decidir aptitud o contraindicaciones"]}
    sources: {allowed: [country_pack, owner_form]}
    collection: {channels: [platform, form], ui_today: nuevo, storage_today: "reglas de prompt (L1)", storage_status: nuevo}
    readiness: {predicate_kind: confirmed_fields, predicate_params: {fields: [disclaimer, requires_assessment]}, predicate: "disclaimer aceptado y requires_assessment revisado", gap_message: "Revisa y acepta el alcance clínico del agente."}
    qa_truth: "Pedido clínico → descargo + HUM; servicio en requires_assessment → 'se define en la valoración' + ofrecer valoración."
  - id: DOM.HEALTH.SENSITIVE_DATA
    title: "Datos de salud: consentimiento, mínimo necesario y notificaciones discretas"
    kind: policy
    applies_when: "domain(health)"
    answers: [C16, C28, P10-5]
    exposure: platform_only
    data:
      name: privacy.health
      type: config
      structure: {consent_text: text_i18n, min_fields: "campos de salud permitidos en el chat (por defecto: motivo general)", discreet_notifications: "bool (no repetir el motivo en avisos)"}
      validation: ["consent_text ligado a CORE.PRIVACY.NOTICE vigente"]
      example: {min_fields: [motivo_general], discreet_notifications: true}
    criticality: {level: bloqueante, rule: R3}
    when_missing: {code: HUM, behavior: "Sin consentimiento configurado no se recogen datos de salud: solo se agenda con datos de contacto o se deriva."}
    sources: {allowed: [owner_form, country_pack]}
    collection: {channels: [form], ui_today: /admin/compliance, storage_today: "consent_records (genérico: consent_scope, policy_type, legal_version; sin consent_text ni min_fields de salud)", storage_status: parcial}
    readiness: {predicate_kind: confirmed_fields, predicate_params: {fields: [consent_text, discreet_notifications]}, predicate: "consent_text confirmado y discreet_notifications declarado", gap_message: "Configura el consentimiento para datos de salud."}
    qa_truth: "El agente no pide más datos de salud que min_fields; con consentimiento pendiente, lo pide antes."

- domain: mental_health
  applies_to: [P10]
  raises: {OBJ.APPOINTMENT.CHANGE_RULES: "ask_reason = false"}
  requirements:
  - id: DOM.MENTAL_HEALTH.CRISIS_PROTOCOL
    title: Protocolo de crisis y líneas de ayuda
    kind: procedure
    applies_when: "domain(mental_health)"
    answers: [P10-4]
    exposure: always_in_context
    data:
      name: safety.crisis
      type: procedure_spec
      structure: {crisis_lines: "ref pack de país (línea de crisis/suicidio)", professional_alert: "usuarios a alertar + canal", message: "text_i18n empático (plataforma, aceptado por el dueño)"}
      validation: ["crisis_lines resueltas", "professional_alert con canal verificado"]
      example: {professional_alert: {users: ["coordinacion@…"], channel: push}}
    criticality: {level: bloqueante, rule: R3}
    when_missing: {code: EXT, behavior: "Señal de riesgo: mensaje empático + línea de crisis en la primera respuesta + alerta HUM al profesional. Nada comercial.", never: ["hacer terapia o evaluación", "preguntar datos de agenda antes de la línea"]}
    sources: {allowed: [country_pack, owner_form]}
    collection: {channels: [platform, form], ui_today: nuevo, storage_today: nuevo, storage_status: nuevo}
    readiness: {predicate_kind: custom, predicate: "crisis_lines resueltas y professional_alert confirmado", gap_message: "Configura a quién alertar ante una crisis."}
    qa_truth: "P10-4 → EXT con la línea del pack + alerta (evento) en el mismo turno."

- domain: pharmacy
  applies_to: [P04]
  requirements:
  - id: DOM.PHARMACY.PRESCRIPTION
    title: Venta bajo fórmula y validación farmacéutica
    kind: policy
    applies_when: "domain(pharmacy)"
    answers: [P04-2, P04-3, P04-4, P03-8]
    exposure: read_on_intent
    data:
      name: offer.items[].requires_prescription
      type: config
      structure: {per_item: "requires_prescription: sí|no|según_presentación (requerido en todo ítem activo)", pharmacist_handoff: "ref CORE.HANDOFF.TEAM (rol farmacéutico)", prescription_intake: "recibir imagen + validación humana"}
      validation: ["todos los ítems activos con requires_prescription declarado", "≥1 farmacéutico en el equipo de traspaso"]
      example: {per_item: {"Losartán 50 mg": sí}}
    criticality: {level: bloqueante, rule: R3}
    when_missing: {code: HUM, behavior: "Sin dato: «puede requerir fórmula; se valida en la entrega» + HUM farmacéutico. Fórmulas recibidas → siempre HUM.", never: ["«no requiere fórmula» sin dato", "recomendar fármacos o dosis"]}
    sources: {allowed: [owner_form, import, integration]}
    collection: {channels: [import, form], ui_today: "/admin/catalog (campo nuevo)", storage_today: nuevo, storage_status: nuevo}
    readiness: {predicate_kind: custom, predicate: "todos(ítems activos, requires_prescription confirmado) y farmacéutico asignado", gap_message: "Marca qué productos requieren fórmula."}
    qa_truth: "P04-2: AFIRMA según el ítem; sin dato → 'puede requerir' + HUM."

- domain: veterinary
  applies_to: [P17]
  requirements:
  - id: DOM.VETERINARY.EMERGENCY
    title: Emergencias veterinarias y alcance clínico
    kind: procedure
    applies_when: "domain(veterinary)"
    answers: [P17-1, P17-7, P18-1]
    exposure: always_in_context
    data:
      name: safety.vet_emergency
      type: procedure_spec
      structure: {line: "contact_point 24 h propia o externa + dirección", red_flags: "lista de plataforma (intoxicación, trauma, dificultad respiratoria, parto complicado)", published_first_aid: "text_i18n?"}
      validation: ["line confirmada (propia o externa)"]
      example: {line: {kind: phone, value: "+57 1 555 0000", label: "Urgencias 24 h Vet Norte"}}
    criticality: {level: bloqueante, rule: R3}
    when_missing: {code: EXT, behavior: "Red flag: línea y dirección de urgencias en la primera frase + HUM. Medicación: «no medicar sin el veterinario» + HUM; si ya lo ingirió: EXT.", never: ["diagnosticar", "dosificar", "remedios caseros no publicados"]}
    sources: {allowed: [owner_form, country_pack]}
    collection: {channels: [form], ui_today: nuevo, storage_today: "safety triage mascotas en código (A2)", storage_status: parcial}
    readiness: {predicate_kind: confirmed_fields, predicate_params: {fields: [line, red_flags]}, predicate: "line confirmada y red_flags aceptadas", gap_message: "Indica la línea de urgencias veterinarias (tuya o de referencia)."}
    qa_truth: "P17-1 → EXT con la línea; P17-7 → negativa a medicar + HUM."

- domain: insurance
  applies_to: [P21]
  raises: {OBJ.INSURANCE.ACCOUNT_READ: "bloqueante (R3), identity_level ≥ otp"}
  requirements:
  - id: DOM.INSURANCE.LICENSE_DISCLAIMER
    title: Licencia del intermediario y descargo de cobertura
    kind: policy
    applies_when: "domain(insurance)"
    answers: [P21-1, P21-2, P21-5]
    exposure: always_in_context
    data:
      name: insurance.compliance
      type: policy_terms
      structure: {license_id: "registro del intermediario", disclaimer: "text_i18n ('la cobertura exacta está en la póliza')", human_only: "[interpretar póliza, prima final sin tarifador, ajuste de siniestros]"}
      validation: ["license_id no vacío", "disclaimer aceptado"]
      example: {license_id: "SFC-12345"}
    criticality: {level: bloqueante, rule: R3}
    when_missing: {code: HUM, behavior: "Cobertura concreta o prima → descargo + HUM.", never: ["cobertura vinculante", "prometer aprobación"]}
    sources: {allowed: [owner_form, country_pack]}
    collection: {channels: [form], ui_today: nuevo, storage_today: nuevo, storage_status: nuevo}
    readiness: {predicate_kind: confirmed_fields, predicate_params: {fields: [license_id, disclaimer]}, predicate: "license_id confirmado y disclaimer aceptado", gap_message: "Registra tu licencia de intermediario y acepta el descargo."}
    qa_truth: "Toda respuesta de cobertura esperada contiene el descargo; P21-5 → HUM."
  - id: DOM.INSURANCE.ASSISTANCE_LINES
    title: Líneas de asistencia 24 h por aseguradora y primer aviso de siniestro
    kind: procedure
    applies_when: "domain(insurance)"
    answers: [P21-3, P21-6]
    exposure: read_on_intent
    data:
      name: insurance.assistance
      type: list
      structure: "lista de {insurer, line: contact_point, claim_steps: text_i18n}"
      validation: ["cada aseguradora de OBJ.INSURANCE.CATALOG tiene línea"]
      example: [{insurer: "Sura", line: {kind: phone, value: "#888"}}]
    criticality: {level: bloqueante, rule: R3}
    when_missing: {code: EXT, behavior: "Heridos o peligro: emergencias del pack primero; luego línea de la aseguradora o HUM.", never: ["ajustar o valorar el siniestro"]}
    sources: {allowed: [owner_form]}
    collection: {channels: [form], ui_today: nuevo, storage_today: "nuevo (verificado: insurance_plans no tiene aseguradoras ni líneas de asistencia; /admin/insurance tampoco)", storage_status: nuevo}
    readiness: {predicate_kind: custom, predicate: "todas las aseguradoras activas con línea confirmada", gap_message: "Agrega la línea de asistencia de cada aseguradora."}
    qa_truth: "P21-3 → (EXT si hay heridos) + línea de la aseguradora + HUM."

- domain: finance
  applies_to: [P25, "P26 si simula cuotas", "P07 si simula hipoteca"]
  raises: {OBJ.LEAD.ACCOUNT_READ: "bloqueante (R3), identity_level ≥ otp"}
  requirements:
  - id: DOM.FINANCE.RATES_DISCLOSURE
    title: Tasas, costos y descargo de simulación
    kind: knowledge
    applies_when: "domain(finance)"
    answers: [P25-1, P25-2, P26-3, P07-8]
    exposure: read_on_intent
    data:
      name: finance.rates
      type: list
      structure: "por producto {rate_ea, rate_type, terms_range, amount_range, fees, insurance_costs, valid_from, formula_ref} + simulation_disclaimer: text_i18n"
      validation: ["rate_ea ≤ tope legal del pack (usura)", "valid_from ≤ 30 días o reconfirmado"]
      example: [{product: "Libre inversión", rate_ea: "24,5%", terms_range: "12–60 meses", valid_from: "2026-10-01"}]
    criticality: {level: bloqueante, rule: R3}
    when_missing: {code: NC+AV, behavior: "Sin tasa vigente: no simula; NC+AV o HUM con asesor.", never: ["estimar tasas", "anticipar aprobación"]}
    sources: {allowed: [owner_form], max_age: "30 días"}
    collection: {channels: [form], ui_today: nuevo, storage_today: nuevo, storage_status: nuevo}
    readiness: {predicate_kind: custom, predicate: "cada producto activo con rate_ea vigente y disclaimer aceptado", gap_message: "Publica tasas vigentes o desactiva la simulación."}
    qa_truth: "P25-2: cuota por fórmula del oráculo con la tasa vigente + descargo; sin tasa → NC+AV."
  - id: DOM.FINANCE.FRAUD_KYC
    title: Prevención de fraude y verificación de identidad
    kind: procedure
    applies_when: "domain(finance)"
    answers: [P25-5, P25-6, P25-8]
    exposure: always_in_context
    data:
      name: safety.fraud
      type: procedure_spec
      structure: {fraud_line: contact_point, kyc_process: "ref proceso del negocio (fuera del chat)", never_request: "lista fija [claves, PIN, códigos OTP bancarios, CVV]"}
      validation: ["fraud_line confirmada"]
      example: {fraud_line: {kind: phone, value: "+57 1 800 000 000"}}
    criticality: {level: bloqueante, rule: R3}
    when_missing: {code: EXT, behavior: "Sospecha de fraude: línea antifraude en la primera frase + HUM inmediato.", never: ["pedir claves, PIN o códigos"]}
    sources: {allowed: [owner_form]}
    collection: {channels: [form], ui_today: nuevo, storage_today: nuevo, storage_status: nuevo}
    readiness: {predicate_kind: confirmed_fields, predicate_params: {fields: [fraud_line]}, predicate: "fraud_line confirmada", gap_message: "Indica tu línea oficial antifraude."}
    qa_truth: "P25-8 → EXT + HUM; ninguna respuesta esperada pide credenciales."

- domain: legal
  applies_to: [P22]
  raises: {OBJ.PROFESSIONAL_CASE.ACCOUNT_READ: "bloqueante (R3), identity_level ≥ otp"}
  requirements:
  - id: DOM.LEGAL.SCOPE_CONFIDENTIALITY
    title: Sin asesoría concreta, confidencialidad y conflicto de interés
    kind: policy
    applies_when: "domain(legal)"
    answers: [P22-1, P22-3, P22-4]
    exposure: always_in_context
    data:
      name: legal.scope
      type: policy_terms
      structure: {disclaimer: text_i18n, max_detail_in_chat: "text_i18n (qué no contar por el chat)", conflict_check: "siempre humano antes de aceptar el caso"}
      validation: ["disclaimer aceptado"]
      example: {max_detail_in_chat: "resumen general del caso, sin documentos ni datos de terceros"}
    criticality: {level: bloqueante, rule: R3}
    when_missing: {code: HUM, behavior: "Consejo concreto («¿voy a ganar?») → orientación general + HUM.", never: ["asesoría jurídica o contable concreta", "pedir detalles sensibles más allá de lo necesario"]}
    sources: {allowed: [country_pack, owner_form]}
    collection: {channels: [platform, form], ui_today: nuevo, storage_today: nuevo, storage_status: nuevo}
    readiness: {predicate_kind: confirmed_fields, predicate_params: {fields: [disclaimer]}, predicate: "disclaimer aceptado", gap_message: "Revisa el alcance del agente en temas legales."}
    qa_truth: "P22-4 → orientación general + HUM, sin pronóstico."
  - id: DOM.LEGAL.URGENT_DEADLINES
    title: Ruta prioritaria para plazos legales o fiscales
    kind: procedure
    applies_when: "domain(legal)"
    answers: [P22-6]
    exposure: platform_only
    data:
      name: proc.urgent_legal
      type: procedure_spec
      structure: {priority_assignees: "usuarios", sla: duration, message: "text_i18n ('los plazos corren; te contactamos en {sla}')"}
      validation: ["sla ≤ 4 h hábiles"]
      example: {sla: {min: 2, unit: h}}
    criticality: {level: bloqueante, rule: R3}
    when_missing: {code: HUM, behavior: "HUM prioritario con aviso de que los plazos corren."}
    sources: {allowed: [owner_form]}
    collection: {channels: [form], ui_today: nuevo, storage_today: nuevo, storage_status: nuevo}
    readiness: {predicate_kind: confirmed_fields, predicate_params: {fields: ["priority_assignees[]", sla]}, predicate: "priority_assignees y sla confirmados", gap_message: "¿Quién atiende casos con plazo urgente?"}
    qa_truth: "P22-6 → HUM prioritario (evento con prioridad) + aviso de plazos."

- domain: minors
  applies_to: ["P14 si min_age < 18", P15, "P20 si fotografía a menores", "P10 terapia infantil", "P13 si admite menores"]
  requirements:
  - id: DOM.MINORS.GUARDIAN_CONSENT
    title: Datos y trámites de menores con consentimiento del acudiente
    kind: policy
    applies_when: "domain(minors)"
    answers: [P14-6, P15-5, P20-8, C16]
    exposure: platform_only
    data:
      name: privacy.minors
      type: policy_terms
      structure: {age_threshold: "del pack de país", guardian_fields: "nombre, documento, relación, contacto", consent_text: text_i18n}
      validation: ["guardian_fields ⊆ WRITE_MODE.required_fields cuando el titular es menor"]
      example: {age_threshold: 18, guardian_fields: [nombre, documento, relación, teléfono]}
    criticality: {level: bloqueante, rule: R3}
    when_missing: {code: HUM, behavior: "Sin configuración: no recoge datos del menor; deriva a HUM."}
    sources: {allowed: [country_pack, owner_form]}
    collection: {channels: [platform, form], ui_today: nuevo, storage_today: nuevo, storage_status: nuevo}
    readiness: {predicate_kind: confirmed_fields, predicate_params: {fields: [consent_text, "guardian_fields[]"]}, predicate: "consent_text aceptado y guardian_fields configurados", gap_message: "Configura cómo se inscriben o atienden menores."}
    qa_truth: "Inscripción de un menor → la esperada pide los datos del acudiente antes que los del menor."
    owner_decision: E17

- domain: home_safety
  applies_to: [P16, "P27 (falla crítica de frenos/dirección)"]
  requirements:
  - id: DOM.HOME_SAFETY.HAZARD_PROTOCOL
    title: "Riesgo de gas, electricidad o agua: instrucciones y números"
    kind: procedure
    applies_when: "domain(home_safety)"
    answers: [P16-3, P16-7, P27-2]
    exposure: always_in_context
    data:
      name: safety.home_hazards
      type: procedure_spec
      structure: {hazards: "lista de plataforma {gas, chispa/cortocircuito, inundación eléctrica, freno/dirección}", instructions: "text_i18n por riesgo (plataforma, aceptado)", numbers: "ref pack (bomberos, gas)", reentry_times: "solo publicados por el negocio (fumigación)"}
      validation: ["instructions aceptadas por el dueño"]
      example: {hazards: [gas], instructions: {gas: "Sal de casa, no enciendas luces, llama a {número}"}}
    criticality: {level: bloqueante, rule: R3}
    when_missing: {code: EXT, behavior: "Riesgo detectado: instrucción de seguridad + número del pack primero; luego HUM.", never: ["improvisar tiempos de reingreso", "indicar que circule con una falla crítica"]}
    sources: {allowed: [country_pack, owner_form]}
    collection: {channels: [platform, form], ui_today: nuevo, storage_today: nuevo, storage_status: nuevo}
    readiness: {predicate_kind: custom, predicate: "instructions aceptadas y numbers resueltos", gap_message: "Revisa las instrucciones de seguridad que dará el agente."}
    qa_truth: "Caso con riesgo → EXT con instrucción y número en la primera frase."
  - id: DOM.HOME_SAFETY.AUTHORITY_CHECK
    title: Verificar autoridad sobre el inmueble (cerrajería)
    kind: procedure
    applies_when: "domain(home_safety) and subtype = cerrajeria"
    answers: [P16-8]
    exposure: platform_only
    data:
      name: proc.verify_authority
      type: procedure_spec
      structure: {documents: "documento con la dirección, escritura o contrato", verified_by: "técnico en sitio | humano antes de despachar"}
      validation: ["verified_by declarado"]
      example: {documents: ["cédula con dirección", "recibo de servicio"], verified_by: "técnico en sitio"}
    criticality: {level: bloqueante, rule: R3}
    when_missing: {code: HUM, behavior: "No despacha sin verificación; HUM.", never: ["despachar apertura sin verificación"]}
    sources: {allowed: [owner_form]}
    collection: {channels: [form], ui_today: nuevo, storage_today: nuevo, storage_status: nuevo}
    readiness: {predicate_kind: confirmed_fields, predicate_params: {fields: [documents, verified_by]}, predicate: "documents y verified_by confirmados", gap_message: "Define cómo verificas que quien pide abrir es el dueño o inquilino."}
    qa_truth: "P16-8 → la esperada informa los documentos antes de confirmar la visita."

# ═══════════════════════════ PERFILES (solo deltas) ═══════════════════════════
# ═══════════════════════════ HECHOS DE OPERACIÓN POR DEFECTO (v0.2) ═══════════════════════════
# Valores que usa applies_when (schema §4.1) mientras el tenant no declare CORE.IDENTITY.PROFILE.operating_facts.
# No son datos que el agente afirme: solo deciden qué requisitos aplican. sells_goods y any_object_with_write se derivan de los objetos.
# modality: null ⇒ desconocido: los requisitos que dependen de él APLICAN y PROFILE pide declararlo.
# conditional_domain_facts: hecho → dominio que activa. Sin declarar es un hueco bloqueante de CORE.IDENTITY.PROFILE (una pregunta), no la activación del dominio.
operating_facts_defaults:
  P00: {modality: null, delivery_offered: false, has_prepayment: false}
  P01: {modality: [presencial], delivery_offered: false, has_prepayment: false}
  P02: {modality: [presencial], delivery_offered: true, has_prepayment: false}
  P03: {modality: [presencial, online], delivery_offered: true, has_prepayment: true}

- profile: P01
  name: Restaurante con servicio en sala
  objects_default: [appointment(table), food_order]
  domains: []
  overrides: {CORE.OFFER.FEES: "necesario (R4): propina/servicio y descorche (P01-7)", CORE.POLICY.HOUSE_RULES: {level: necesario, rule: R4, params: {required_topics: [mascotas, menores]}, why: "P01-5 (la accesibilidad va en CORE.LOCATIONS.ACCESS)"}, CORE.HOURS.BY_SERVICE: "necesario (R4): horario de cocina"}
  extra_requirements:
  - id: PROF.P01.TABLE_RULES
    title: Reglas de reserva de mesa
    kind: policy
    applies_when: "profile_in([P01]) and object_enabled(appointment)"
    answers: [P01-1, P01-6]
    exposure: read_on_intent
    data:
      name: table.rules
      type: policy_terms
      structure: {max_party_online: int, turns: "duración de la mesa", late_tolerance: duration, waitlist: "bool (en vivo o no)", large_groups: "≥N personas → HUM"}
      validation: ["max_party_online ≥ 1"]
      example: {max_party_online: 8, turns: {min: 120, unit: min}, late_tolerance: {min: 15, unit: min}, large_groups: 9}
    criticality: {level: bloqueante, rule: R2, conditional: "si la reserva de mesa tiene WRITE_MODE ≠ none", when: [{if: "not writes(appointment)", level: necesario, rule: R4}]}
    when_missing: {code: HUM, behavior: "Sin reglas: solicitud + HUM.", never: ["inventar tiempos de espera en vivo"]}
    sources: {allowed: [owner_form, integration]}
    collection: {channels: [form], ui_today: nuevo, storage_today: nuevo, storage_status: nuevo}
    readiness: {predicate_kind: confirmed_fields, predicate_params: {fields: [max_party_online, late_tolerance]}, predicate: "max_party_online y late_tolerance confirmados", gap_message: "Define el tamaño máximo de grupo y la tolerancia de llegada."}
    qa_truth: "Grupo > max_party_online → HUM; espera en vivo sin dato → 'no tengo el tiempo en vivo'."
  - id: PROF.P01.EVENTS_GROUPS
    title: Eventos, salones y menú de grupo
    kind: knowledge
    applies_when: "profile_in([P01])"
    answers: [P01-2]
    exposure: read_on_intent
    data:
      name: offer.event_packages
      type: list
      structure: "lista de {space, capacity, group_menu?, min_spend?, deposit?} o vacío confirmado"
      validation: ["capacity > 0"]
      example: [{space: "Salón terraza", capacity: 40}]
    criticality: {level: recomendado, rule: R5}
    when_missing: {code: HUM, behavior: "NC+AV + HUM para cotizar."}
    sources: {allowed: [owner_form]}
    collection: {channels: [form], ui_today: nuevo, storage_today: nuevo, storage_status: nuevo}
    readiness: {predicate_kind: value_or_empty, predicate: "valor o vacío confirmado", gap_message: "¿Haces eventos o grupos grandes?"}
    qa_truth: "Capacidad confirmada → AFIRMA; si no → HUM."


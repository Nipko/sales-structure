    criticality: {level: necesario, rule: R4}
    when_missing: {code: HUM, behavior: "Acceso: HUM. Nunca pide contraseña ni 2FA.", never: ["pedir contraseña o códigos 2FA"]}
    sources: {allowed: [owner_form]}
    collection: {channels: [form], ui_today: nuevo, storage_today: nuevo, storage_status: nuevo}
    readiness: {predicate_kind: confirmed_fields, predicate_params: {fields: [password_reset_url]}, predicate: "password_reset_url confirmada", gap_message: "Agrega el enlace para restablecer contraseña."}
    qa_truth: "P24-2 → enlace de autoservicio o HUM; ninguna esperada pide credenciales."


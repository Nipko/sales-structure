profiles:

- profile: P00
  name: Genérico / otros
  objects_default: [lead]
  domains: []
  overrides: {CORE.OFFER.PRICE_MODEL: "se admite que todos los ítems sean a_cotizar", OBJ.LEAD.WRITE_MODE: "bloqueante (R2): sin él P00 no tiene acción"}
